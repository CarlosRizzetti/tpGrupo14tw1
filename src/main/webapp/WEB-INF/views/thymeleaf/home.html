<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{layouts/app :: layout(~{::content}, ~{::header_left}, ~{::header_center}, ~{::header_right}, _, _)}">
<head>
  <title>Categorías</title>
</head>
<body>


<div th:fragment="header_left" class="relative">
    <button id="profileBtn" class="flex items-center px-4 py-2 bg-black/10 hover:bg-black/20 rounded-lg font-bold uppercase text-xs border border-white/20 transition text-white">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
        </svg>
        Mi Perfil
        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 ml-1" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
        </svg>
    </button>

    <div id="profileMenu" class="hidden absolute left-0 mt-2 w-56 bg-white rounded-md shadow-xl py-1 z-50 border border-gray-200">
        <div class="px-4 py-3 border-b border-gray-100 bg-gray-50">
            <p class="text-sm text-gray-500">Sesión iniciada como</p>
            <p class="text-sm font-bold text-gray-800 truncate"
               th:if="${userEmail != null}"
               th:text="${#strings.capitalize(#strings.substring(userEmail, 0, userEmail.indexOf('@')))}">

                Usuario
            </p>
        </div>

        <a sec:authorize="hasRole('ADMIN')" th:href="@{/admin}" class="flex items-center px-4 py-2 text-sm text-gray-700 hover:bg-blue-50 hover:text-blue-700 transition-colors">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
            </svg>
            Panel de Control
        </a>

        <a th:href="@{/logout}" class="flex items-center px-4 py-2 text-sm text-red-600 hover:bg-red-50 transition-colors">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
            </svg>
            Cerrar Sesión
        </a>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            var btn = document.getElementById('profileBtn');
            var menu = document.getElementById('profileMenu');

            btn.addEventListener('click', function(event) {
                event.stopPropagation();
                menu.classList.toggle('hidden');
            });

            // Cerrar el menú si hacemos click en otro lugar de la ventana
            window.addEventListener('click', function(event) {
                if (!btn.contains(event.target) && !menu.contains(event.target)) {
                    menu.classList.add('hidden');
                }
            });
        });
    </script>
</div>

<!-- FRAGMENTO 1 -->
<div th:fragment="header_center">
    <span class="text-puesto-header-text font-bold uppercase tracking-widest">Seleccione Categoría</span>
</div>


<!-- FRAGMENTO 2 -->
<div th:fragment="header_right">
    <a sec:authorize="hasRole('ADMIN')"
       th:href="@{/dashboard/global}"
       class="md:flex items-center px-4 py-2 bg-black/10 hover:bg-black/20 rounded-lg border border-white/20 transition text-xs font-bold uppercase tracking-wider">
        Dashboard Global
    </a>
</div>

       <div class="grid grid-cols-1 md:grid-cols-2 gap-4 md:gap-6 pb-10">
         <a th:each="categoria : ${categorias}"
