<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layouts/app :: layout(~{::content}, ~{::header_left}, ~{::header_center}, ~{::header_right}, ~{}, _)}">
<head>
    <title>Consultar Stock</title>
</head>
<body>
<div th:fragment="header_center">
    <span class="text-puesto-header-text font-bold uppercase tracking-widest">
        Consultar Stock
    </span>
</div>
<div th:fragment="header_left">
    <a th:href="@{/admin}" class="flex items-center px-4 py-2 bg-black/10 hover:bg-black/20 rounded-lg font-bold uppercase text-xs border border-white/20 transition">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 mr-1" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M15 19l-7-7 7-7" />
        </svg>
        Volver
    </a>
</div>
<div th:fragment="header_right">
    <a th:href="@{/dashboard}"
       class="hidden md:flex items-center px-4 py-2 bg-black/10 hover:bg-black/20 rounded-lg border border-white/20 transition text-xs font-bold uppercase tracking-wider">
        Dashboard
    </a>
</div>
<div th:fragment="content" class="p-6 max-w-5xl mx-auto">

    <div class="mb-6 md:hidden">
        <a th:href="@{/category/5/products}" class="inline-flex items-center px-4 py-2 bg-puesto-btn text-puesto-btn-text text-sm font-bold uppercase rounded-lg border border-puesto-btn-border shadow">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 mr-1" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M15 19l-7-7 7-7" />
            </svg>
            Volver
        </a>
    </div>
    <div class="bg-white dark:bg-gray-800 rounded-xl shadow-lg overflow-hidden border border-gray-200 dark:border-gray-700">
        <div class="px-6 py-4 border-b border-gray-200 dark:border-gray-700 bg-gray-50 dark:bg-gray-900/50 flex justify-between items-center">
            <h2 class="text-xl font-bold text-gray-800 dark:text-white flex items-center">
                <svg class="w-6 h-6 mr-2 text-indigo-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 17v-2m3 2v-4m3 4v-6m2 10H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                Stock Consolidado
            </h2>
            <div class="flex items-center space-x-3">
                <span class="bg-indigo-100 text-indigo-800 text-xs font-semibold px-2.5 py-1 rounded-lg dark:bg-indigo-200 dark:text-indigo-900" th:text="${#lists.size(stockArticulos)} + ' Productos'"></span>
            </div>
        </div>

        <div th:if="${#lists.isEmpty(stockArticulos)}" class="p-8 text-center text-gray-500 dark:text-gray-400">
            <svg class="mx-auto h-12 w-12 text-gray-400 mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 13V6a2 2 0 00-2-2H6a2 2 0 00-2 2v7m16 0v5a2 2 0 01-2 2H6a2 2 0 01-2-2v-5m16 0h-2.586a1 1 0 00-.707.293l-2.414 2.414a1 1 0 01-.707.293h-3.172a1 1 0 01-.707-.293l-2.414-2.414A1 1 0 006.586 13H4"></path></svg>
            <p class="text-lg">No hay stock de lotes disponible.</p>
        </div>
        <div th:unless="${#lists.isEmpty(stockArticulos)}" class="overflow-x-auto">
            <table class="w-full text-sm text-left text-gray-500 dark:text-gray-400">
                <thead class="text-xs text-gray-700 uppercase bg-gray-50 dark:bg-gray-700 dark:text-gray-300">
                <tr>
                    <th scope="col" class="px-6 py-3 rounded-tl-lg">Producto</th>
                    <th scope="col" class="px-6 py-3 text-right">Stock Total</th>
                    <th scope="col" class="px-6 py-3">Lote en uso</th>
                    <th scope="col" class="px-6 py-3 rounded-tr-lg">Lotes disponibles</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="stock : ${stockArticulos}" class="bg-white border-b dark:bg-gray-800 dark:border-gray-700 hover:bg-gray-50 dark:hover:bg-gray-700/50 transition align-top">
                    <td class="px-6 py-4 font-medium text-gray-900 dark:text-white" th:text="${stock.nombreProducto}"></td>
                    <td class="px-6 py-4 text-right font-bold text-indigo-600 dark:text-indigo-400 text-lg" th:text="${stock.stockTotal}"></td>
                    <td class="px-6 py-4">
                        <div th:if="${stock.loteEnUso != null}" class="inline-flex flex-col bg-blue-50 dark:bg-blue-900/20 border border-blue-200 dark:border-blue-800 rounded-lg px-3 py-1.5">
                            <span class="text-xs font-bold text-blue-800 dark:text-blue-300">Lote Nº <span th:text="${stock.loteEnUso.numeroDeLote}"></span></span>
                            <span class="text-[11px] text-blue-700 dark:text-blue-400">
                                    <span th:text="${stock.loteEnUso.cantidadDisponible}"></span> uds · vence <span th:text="${#temporals.format(stock.loteEnUso.fechaDeVencimiento, 'dd/MM/yyyy')}"></span>
                                </span>
                        </div>
                        <span th:if="${stock.loteEnUso == null}" class="text-xs text-gray-400 italic">Sin lote en uso</span>
                    </td>
                    <td class="px-6 py-4">
                        <div th:if="${#lists.isEmpty(stock.lotesDisponibles)}" class="text-xs text-gray-400 italic">Sin lotes en espera</div>
                        <div th:unless="${#lists.isEmpty(stock.lotesDisponibles)}" class="flex flex-col gap-1">
                            <div th:each="lote : ${stock.lotesDisponibles}" class="inline-flex flex-col bg-gray-50 dark:bg-gray-700/40 border border-gray-200 dark:border-gray-600 rounded-lg px-3 py-1">
                                <span class="text-xs font-semibold text-gray-700 dark:text-gray-200">Lote Nº <span th:text="${lote.numeroDeLote}"></span></span>
                                <span class="text-[11px] text-gray-500 dark:text-gray-400">
                                        <span th:text="${lote.cantidadDisponible}"></span> uds · vence <span th:text="${#temporals.format(lote.fechaDeVencimiento, 'dd/MM/yyyy')}"></span>
                                    </span>
                            </div>
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
