<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Caja</title>
    <link rel="stylesheet" th:href="@{/resources/core/css/app.css}">
</head>
<body class="tema-servicio min-h-screen bg-puesto-app font-sans text-slate-800">

<header class="bg-puesto-header text-puesto-header-text shadow-md">

    <div class="max-w-full mx-auto px-6 py-3 flex items-center justify-between">
        <h1 class="text-xl font-bold tracking-tight">Puesto de Caja</h1>

        <a th:href="@{/logout}"
           class="flex items-center gap-2 px-4 py-2 bg-black/10 hover:bg-black/20 rounded-lg border border-white/20 transition text-xs font-bold uppercase tracking-wider">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>
            </svg>
            Cerrar sesión
        </a>
    </div>
</header>

<!-- Layout general: 70/30 horizontal -->
<main class="p-4 grid grid-cols-10 gap-4" style="height: calc(100vh - 60px);">

    <!-- IZQUIERDA (70%): arriba producto seleccionado (20%h), abajo grilla de productos (80%h) -->
    <div class="col-span-7 grid grid-rows-10 gap-4 min-h-0">

        <!-- Panel superior: producto seleccionado con checkboxes de ingredientes -->
        <section class="row-span-2 bg-white rounded-lg border border-slate-200 shadow-sm p-4 flex flex-col min-h-0"
                 data-panel-seleccion>
            <div data-estado-vacio class="flex-1 flex items-center justify-center text-slate-400 text-sm">
                Seleccioná un producto para armarlo. Los ingredientes marcados van al pedido.
            </div>

            <div data-estado-con-producto class="hidden flex-1 flex flex-col min-h-0">
                <div class="flex items-start justify-between gap-4 mb-3">
                    <div>
                        <h2 class="font-bold text-lg text-slate-900" data-nombre-producto>Producto</h2>
                        <p class="text-puesto-accent font-semibold" data-precio-producto>$0,00</p>
                    </div>
                    <button type="button" data-btn-confirmar
                            class="bg-puesto-btn text-puesto-btn-text border border-puesto-btn-border rounded-md px-5 py-2 font-semibold hover:bg-puesto-btn-hover-bg transition">
                        Agregar al carrito
                    </button>
                </div>

                <div data-lista-ingredientes class="flex-1 overflow-y-auto flex flex-wrap gap-2 content-start"></div>

                <p data-sin-ingredientes class="hidden text-slate-500 text-sm italic">
                    Este producto se agrega tal cual, sin ingredientes personalizables.
                </p>
            </div>
        </section>

        <!-- Panel inferior: categorías + grilla de productos -->
        <section class="row-span-8 bg-white rounded-lg border border-slate-200 shadow-sm p-4 flex flex-col min-h-0">
            <div class="flex gap-2 mb-4 flex-wrap" data-lista-categorias>
                <button th:each="cat, iter : ${categorias}"
                        type="button"
                        th:attr="data-id-categoria=${cat.id},data-tema=${cat.tema}"
                        th:classappend="${iter.first} ? 'ring-2 ring-offset-1 ring-puesto-accent' : ''"
                        class="px-4 py-2 rounded-md border border-slate-200 hover:bg-slate-50 transition text-sm font-semibold flex items-center gap-2"
                        data-btn-categoria>
                    <span th:text="${cat.nombre}">Cocina</span>
                </button>
            </div>

            <div class="flex-1 overflow-y-auto">
                <div data-grilla-productos class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-3">
                    <p class="col-span-full text-slate-400 text-sm text-center py-8" data-mensaje-productos>
                        Cargando productos…
                    </p>
                </div>
            </div>
        </section>
    </div>

    <!-- DERECHA (30%): carrito arriba, botón cobrar abajo -->
    <aside class="col-span-3 bg-white rounded-lg border border-slate-200 shadow-sm flex flex-col min-h-0">
        <div class="p-4 border-b border-slate-100">
            <h2 class="font-bold text-slate-900">Pedido</h2>
            <p class="text-xs text-slate-500 mt-0.5" data-cantidad-items>0 items</p>
        </div>

        <div class="flex-1 overflow-y-auto p-4 min-h-0" data-lista-carrito>
            <p class="text-slate-400 text-sm text-center py-8" data-carrito-vacio>
                El carrito está vacío.
            </p>
        </div>

        <div class="border-t border-slate-100 p-4 space-y-3">
            <div class="flex items-center justify-between">
                <span class="text-slate-600 text-sm">Total</span>
                <span class="text-2xl font-bold text-slate-900" data-total>$0,00</span>
            </div>
            <button type="button" data-btn-cobrar
                    class="w-full bg-puesto-btn text-puesto-btn-text border border-puesto-btn-border rounded-md px-4 py-3 font-semibold hover:bg-puesto-btn-hover-bg transition disabled:opacity-50 disabled:cursor-not-allowed"
                    disabled>
                Cobrar
            </button>
        </div>
    </aside>
</main>

<script type="module" th:src="@{/resources/core/js/caja.js}"></script>
</body>
</html>
