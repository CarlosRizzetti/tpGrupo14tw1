<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Cobrar pedido</title>
    <link rel="stylesheet" th:href="@{/resources/core/css/app.css}">
</head>
<body class="tema-servicio min-h-screen bg-puesto-app font-sans text-slate-800">

<header class="bg-puesto-header text-puesto-header-text shadow-md">
    <div class="max-w-full mx-auto px-6 py-3 flex items-center justify-between">
        <h1 class="text-xl font-bold tracking-tight">Cobrar pedido</h1>
        <a th:href="@{/cajero}" class="text-sm hover:underline">← Volver a la caja</a>
    </div>
</header>

<main class="p-4 grid grid-cols-10 gap-4" style="height: calc(100vh - 60px);">

    <!-- IZQUIERDA (40%): detalle del pedido -->
    <aside class="col-span-4 bg-white rounded-lg border border-slate-200 shadow-sm flex flex-col min-h-0">
        <div class="p-4 border-b border-slate-100">
            <h2 class="font-bold text-slate-900">Detalle del pedido</h2>
            <p class="text-xs text-slate-500 mt-0.5" th:text="${carrito.items.size() + ' item' + (carrito.items.size() == 1 ? '' : 's')}">0 items</p>
        </div>

        <div class="flex-1 overflow-y-auto p-4 min-h-0">
            <div th:each="item : ${carrito.items}"
                 class="py-3 border-b border-slate-100 last:border-b-0">
                <div class="flex items-start justify-between gap-2">
                    <p class="font-semibold text-slate-900" th:text="${item.nombre}">Item</p>
                    <p class="text-sm font-semibold text-puesto-accent">
                        $<span th:text="${#numbers.formatDecimal(item.precio, 1, 2)}">0,00</span>
                    </p>
                </div>
                <p class="text-xs text-slate-500 mt-1">
                    <th:block th:each="ing, iter : ${item.ingredientes}" th:if="${ing.cantidad > 0}">
                        <span th:text="${ing.nombre}">Ing</span><span th:if="${ing.cantidad > 1}" th:text="' x' + ${ing.cantidad}"></span><span th:unless="${iter.last}">, </span>
                    </th:block>
                </p>
            </div>
        </div>

        <div class="border-t border-slate-100 p-4 flex items-center justify-between">
            <span class="text-slate-600">Total</span>
            <span class="text-3xl font-bold text-slate-900" data-total-pedido
                  th:attr="data-monto=${carrito.total}">
                $<span th:text="${#numbers.formatDecimal(carrito.total, 1, 2)}">0,00</span>
            </span>
        </div>
    </aside>

    <!-- DERECHA (60%): medios de pago -->
    <section class="col-span-6 grid grid-rows-2 gap-4 min-h-0">

        <!-- Efectivo + calculadora de cambio -->
        <div class="bg-white rounded-lg border border-slate-200 shadow-sm p-6 flex flex-col min-h-0">
            <div class="flex items-center gap-3 mb-4">
                <div class="w-10 h-10 rounded-full bg-emerald-100 text-emerald-700 flex items-center justify-center">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 18.75a60.07 60.07 0 0 1 15.797 2.101c.727.198 1.453-.342 1.453-1.096V18.75M3.75 4.5v.75A.75.75 0 0 1 3 6h-.75m0 0v-.375c0-.621.504-1.125 1.125-1.125H20.25M2.25 6v9m18-10.5v.75c0 .414.336.75.75.75h.75m-1.5-1.5h.375c.621 0 1.125.504 1.125 1.125v9.75c0 .621-.504 1.125-1.125 1.125h-.375m1.5-1.5H21a.75.75 0 0 0-.75.75v.75m0 0H3.75m0 0h-.375a1.125 1.125 0 0 1-1.125-1.125V15m1.5 1.5v-.75A.75.75 0 0 0 3 15h-.75M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Zm3 0h.008v.008H18V12Zm-12 0h.008v.008H6V12Z"/>
                    </svg>
                </div>
                <div>
                    <h2 class="font-bold text-slate-900">Efectivo</h2>
                    <p class="text-xs text-slate-500">Calculadora de cambio</p>
                </div>
            </div>

            <div class="grid grid-cols-2 gap-4 flex-1">
                <div class="flex flex-col">
                    <label for="efectivo" class="text-sm font-medium text-slate-700 mb-1">
                        Efectivo recibido
                    </label>
                    <input id="efectivo" type="text" inputmode="numeric"
                           placeholder="0,00"
                           data-input-efectivo
                           class="text-2xl font-bold px-4 py-3 rounded-md border-2 border-slate-200 focus:outline-none focus:border-puesto-accent"/>

                    <div class="flex flex-wrap gap-1.5 mt-2" data-atajos-monto>
                        <button type="button" data-monto="1000"
                                class="text-xs px-2 py-1 rounded border border-slate-200 hover:bg-slate-50 transition">
                            +$1000
                        </button>
                        <button type="button" data-monto="2000"
                                class="text-xs px-2 py-1 rounded border border-slate-200 hover:bg-slate-50 transition">
                            +$2000
                        </button>
                        <button type="button" data-monto="5000"
                                class="text-xs px-2 py-1 rounded border border-slate-200 hover:bg-slate-50 transition">
                            +$5000
                        </button>
                        <button type="button" data-monto="10000"
                                class="text-xs px-2 py-1 rounded border border-slate-200 hover:bg-slate-50 transition">
                            +$10000
                        </button>
                        <button type="button" data-monto-exacto
                                class="text-xs px-2 py-1 rounded border border-puesto-accent text-puesto-accent hover:bg-blue-50 transition">
                            Justo
                        </button>
                    </div>
                </div>

                <div class="flex flex-col">
                    <label class="text-sm font-medium text-slate-700 mb-1">Cambio a dar</label>
                    <div class="text-2xl font-bold px-4 py-3 rounded-md bg-slate-50 border-2 border-slate-100"
                         data-cambio>
                        $0,00
                    </div>
                    <p class="text-xs mt-2" data-estado-pago>
                        <span class="text-slate-400">Ingresá el efectivo recibido.</span>
                    </p>
                </div>
            </div>

            <div class="mt-4 flex items-center gap-3 pt-4 border-t border-slate-100">
                <div class="flex-1">
                    <label for="documento" class="text-sm font-medium text-slate-700">
                        DNI del cliente <span class="text-slate-400">(opcional)</span>
                    </label>
                    <input id="documento" type="text" inputmode="numeric"
                           placeholder="Ej: 40123456"
                           data-input-documento
                           class="w-full mt-1 px-3 py-2 rounded-md border border-slate-200 focus:outline-none focus:ring-2 focus:ring-puesto-accent"/>
                    <p class="text-xs mt-1 min-h-[1rem]" data-info-cliente></p>
                </div>
                <button type="button" data-btn-cobrar-efectivo
                        class="bg-puesto-btn text-puesto-btn-text border border-puesto-btn-border rounded-md px-6 py-3 font-semibold hover:bg-puesto-btn-hover-bg transition disabled:opacity-50 disabled:cursor-not-allowed"
                        disabled>
                    Confirmar cobro
                </button>
            </div>
        </div>

        <!-- Mercado Pago (todavía no integrado) -->
        <div class="bg-white rounded-lg border border-slate-200 shadow-sm p-6 flex flex-col justify-between">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-full bg-sky-100 text-sky-700 flex items-center justify-center">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 8.25h19.5M2.25 9h19.5m-16.5 5.25h6m-6 2.25h3m-3.75 3h15a2.25 2.25 0 0 0 2.25-2.25V6.75A2.25 2.25 0 0 0 19.5 4.5h-15a2.25 2.25 0 0 0-2.25 2.25v10.5A2.25 2.25 0 0 0 4.5 19.5Z"/>
                    </svg>
                </div>
                <div class="flex-1">
                    <h2 class="font-bold text-slate-900">Mercado Pago</h2>
                    <p class="text-xs text-slate-500">Pago con QR / tarjeta</p>
                </div>
                <span class="text-xs bg-amber-100 text-amber-700 px-2 py-1 rounded-full font-semibold">
                    Próximamente
                </span>
            </div>

            <button type="button" disabled
                    class="mt-4 w-full py-3 rounded-md border-2 border-dashed border-slate-200 text-slate-400 font-semibold cursor-not-allowed">
                Integración pendiente
            </button>
        </div>
    </section>
</main>

<script type="module" th:src="@{/resources/core/js/cobro.js}"></script>
</body>
</html>
