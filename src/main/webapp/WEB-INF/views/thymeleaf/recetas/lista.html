<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layouts/app :: layout(~{::content}, ~{::header_left}, ~{::header_center}, ~{::header_right}, _, _)}">
<head>
    <title>Composiciones</title>
</head>
<body>

<div th:fragment="header_left">
    <a th:href="@{/admin}" class="flex items-center px-4 py-2 bg-black/10 hover:bg-black/20 rounded-lg font-bold uppercase text-xs border border-white/20 transition">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 mr-1" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M15 19l-7-7 7-7" />
        </svg>
        Volver
    </a>
</div>

<div th:fragment="header_center">
    <span class="text-puesto-header-text font-bold uppercase tracking-widest">Composiciones / Recetas</span>
</div>

<div th:fragment="header_right">
    <a th:href="@{/admin/recetas/nueva}" class="md:flex items-center px-4 py-2 bg-green-500 hover:bg-green-600 rounded-lg border border-white/20 transition text-xs font-bold uppercase tracking-wider text-white">
        + Nueva Composición
    </a>
</div>

<div th:fragment="content" class="p-6 max-w-7xl mx-auto">
    <div class="mb-8">
        <h2 class="text-3xl font-black text-black opacity-80 mb-2">Composiciones Actuales</h2>
        <p class="font-black mb-2 opacity-80">Revisa qué artículos se descuentan al generar los vencimientos.</p>
    </div>

    <div class="bg-white rounded-3xl shadow-xl overflow-hidden">
        <table class="w-full text-left border-collapse">
            <thead>
                <tr class="bg-gray-100 text-gray-700">
                    <th class="p-4 font-bold border-b w-1/3">Producto</th>
                    <th class="p-4 font-bold border-b w-2/3">Composición (Artículos)</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="r : ${recetas}" class="border-b hover:bg-gray-50 transition-colors">
                    <td class="p-4 font-bold align-top text-xl" th:text="${r.producto.nombre}"></td>
                    <td class="p-4 align-top">
                        <ul class="list-disc pl-4 text-gray-700">
                            <li th:each="d : ${r.ingredientes}" 
                                th:text="${d.cantidad} + ' x ' + ${d.articulo.nombre}">
                            </li>
                        </ul>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(recetas)}">
                    <td colspan="2" class="p-6 text-center text-gray-500 font-bold">No hay composiciones cargadas todavía.</td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

</body>
</html>
