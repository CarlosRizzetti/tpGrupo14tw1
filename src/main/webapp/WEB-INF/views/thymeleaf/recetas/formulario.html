<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layouts/app :: layout(~{::content}, ~{::header_left}, ~{::header_center}, ~{::header_right}, _, ~{::scripts})}">
<head>
    <title>Nueva Composición</title>
</head>
<body>

<div th:fragment="header_left">
    <a th:href="@{/admin/recetas}" class="flex items-center px-4 py-2 bg-black/10 hover:bg-black/20 rounded-lg font-bold uppercase text-xs border border-white/20 transition">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 mr-1" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M15 19l-7-7 7-7" />
        </svg>
        Cancelar
    </a>
</div>

<div th:fragment="header_center">
    <span class="text-puesto-header-text font-bold uppercase tracking-widest">Armar Composición</span>
</div>

<div th:fragment="header_right"></div>

<div th:fragment="content" class="p-6 max-w-4xl mx-auto">
    <div class="mb-8">
        <h2 class="text-3xl font-black text-black opacity-80 mb-2">Definir Receta</h2>
        <p class="font-black mb-2 opacity-80">Elige un producto e indica qué artículos lo componen.</p>
    </div>

    <form th:action="@{/admin/recetas/guardar}" method="post" class="bg-white p-6 rounded-3xl shadow-xl">
        
        <div class="mb-6">
            <label class="block text-gray-700 font-bold mb-2">Producto a Generar:</label>
            <select name="productoId" required class="w-full border p-3 rounded-lg bg-gray-50 focus:ring focus:ring-blue-200">
                <option value="" disabled selected>-- Selecciona un Producto --</option>
                <option th:each="p : ${productos}" th:value="${p.id}" th:text="${p.nombre}"></option>
            </select>
        </div>

        <div class="mb-4">
            <h3 class="text-xl font-bold text-gray-800 mb-2">Artículos (Ingredientes)</h3>
            <p class="text-sm text-gray-500 mb-4">Añade los artículos que se descontarán cuando se genere este producto.</p>
            
            <div id="articulos-container" class="space-y-3">
                <div class="flex gap-4 items-center articulo-row">
                    <select name="articulosIds" class="flex-grow border p-2 rounded-lg bg-gray-50" required>
                        <option value="" disabled selected>-- Elige un artículo --</option>
                        <option th:each="a : ${articulos}" th:value="${a.id}" th:text="${a.nombre}"></option>
                    </select>
                    <input type="number" step="0.01" name="cantidades" placeholder="Cantidad" required min="0.01" class="w-32 border p-2 rounded-lg bg-gray-50">
                    <button type="button" class="text-red-500 font-bold hover:text-red-700 w-10 text-xl btn-remove">&times;</button>
                </div>
            </div>
            
            <button type="button" id="btn-add-articulo" class="mt-4 px-4 py-2 bg-blue-100 text-blue-700 font-bold rounded hover:bg-blue-200 transition">
                + Añadir otro artículo
            </button>
        </div>

        <div class="mt-8 flex justify-end">
            <button type="submit" class="px-6 py-3 bg-blue-600 text-white font-bold rounded-xl shadow hover:bg-blue-700 transition">
                Guardar Composición
            </button>
        </div>
    </form>
</div>

<!-- SCRIPTS DE LA VISTA -->
<th:block th:fragment="scripts">
<script>
    document.addEventListener('DOMContentLoaded', () => {
        const container = document.getElementById('articulos-container');
        const btnAdd = document.getElementById('btn-add-articulo');

        btnAdd.addEventListener('click', () => {
            const row = container.querySelector('.articulo-row').cloneNode(true);
            row.querySelector('select').value = "";
            row.querySelector('input').value = "";
            container.appendChild(row);
        });

        container.addEventListener('click', (e) => {
            if(e.target.classList.contains('btn-remove')) {
                if(container.querySelectorAll('.articulo-row').length > 1) {
                    e.target.closest('.articulo-row').remove();
                } else {
                    alert('Debe haber al menos un artículo en la composición.');
                }
            }
        });
    });
</script>
</th:block>

</body>
</html>
