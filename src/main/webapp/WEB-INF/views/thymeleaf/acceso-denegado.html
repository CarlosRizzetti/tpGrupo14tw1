<!DOCTYPE html>

<head>

</head>
<body>

<div th:fragment="header_left">
    <a th:href="@{/home}" class="px-4 py-2 bg-black/10 hover:bg-black/20 rounded-lg text-xs font-bold transition text-white">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 mr-1" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M15 19l-7-7 7-7" />
        </svg>
        Volver
    </a>
</div>

<div th:fragment="header_center"></div>
<div th:fragment="header_right"></div>

<div th:fragment="content" class="p-10 flex flex-col items-center justify-center min-h-[50vh]">
    <svg xmlns="http://www.w3.org/2000/svg" class="h-24 w-24 text-red-500 mb-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
    </svg>
    <h1 class="text-4xl font-bold text-gray-800">403 - Acceso Denegado</h1>
    <p class="text-gray-600 mt-2 text-center max-w-md">No tienes los permisos de Administrador necesarios para acceder a este panel. Si crees que esto es un error, contacta a soporte.</p>
    <a th:href="@{/home}" class="mt-6 px-6 py-3 bg-blue-600 hover:bg-blue-700 text-white rounded-xl shadow-lg transition-all font-bold">Ir al Inicio</a>
</div>
