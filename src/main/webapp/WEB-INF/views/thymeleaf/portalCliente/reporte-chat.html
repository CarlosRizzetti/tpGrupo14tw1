<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layouts/app :: layout(~{::content}, ~{::header_left}, ~{::header_center}, ~{::header_right}, _, _)}">
<head>
    <title>Chat de Soporte - MCD</title>
</head>
<body>
<div th:fragment="header_left"><a th:href="@{/portal/clientes/perfil}" class="text-white font-bold">&larr; Volver al Perfil</a></div>
<div th:fragment="header_center"><span class="text-white font-bold uppercase">Soporte Técnico</span></div>
<div th:fragment="header_right"></div>

<div th:fragment="content" class="p-6 max-w-2xl mx-auto py-8">
    <div class="bg-white rounded-3xl shadow-xl border-4 border-slate-200 p-8">

        <h2 class="text-2xl font-black uppercase tracking-tight text-slate-800 mb-2">
            Reporte del Pedido #<span th:text="${pedido.id}"></span>
        </h2>
        <p class="text-slate-500 mb-6 border-b pb-4">Interactúa con nuestro sistema automatizado para resolver tu inconveniente.</p>

        <div id="chat-container" th:data-id="${pedido.id}" class="bg-slate-50 border border-slate-200 rounded-xl p-4">
            <div id="chat-historial" class="h-80 overflow-y-auto mb-4 border-b border-slate-200 pb-4 pr-2 space-y-3">

                <div th:if="${pedido.reportado}" class="text-left bg-blue-100 text-blue-900 font-medium p-3 rounded-lg rounded-tl-none w-5/6 shadow-sm">
                    <span th:text="${pedido.comentarioReclamo ?: 'Tu reporte está abierto. ¿Cómo quieres continuar?'}"></span>
                </div>

            </div>

            <div id="chat-botones" class="flex gap-2 flex-wrap pt-2">
                <button th:if="${!pedido.reportado}" onclick="enviarAccion('INICIAR')"
                        class="bg-blue-600 hover:bg-blue-700 text-white font-bold px-5 py-2.5 rounded-lg w-full transition shadow">
                    Iniciar Reporte Automático
                </button>

                <th:block th:if="${pedido.reportado}">
                    <button onclick="enviarAccion('Actualizar reporte')" class="bg-slate-200 hover:bg-slate-300 text-slate-800 font-bold px-4 py-2 rounded-lg border border-slate-300">Actualizar reporte</button>
                    <button onclick="enviarAccion('Dar por realizado')" class="bg-emerald-100 hover:bg-emerald-200 text-emerald-800 font-bold px-4 py-2 rounded-lg border border-emerald-300">Dar por realizado</button>
                    <button onclick="enviarAccion('Desestimar')" class="bg-red-100 hover:bg-red-200 text-red-800 font-bold px-4 py-2 rounded-lg border border-red-300">Desestimar</button>
                </th:block>
            </div>
        </div>
    </div>

    <script>
        // Leemos el ID directamente del HTML, es a prueba de fallos.
        const pedidoId = document.getElementById('chat-container').getAttribute('data-id');
        const urlBase = '/portal/clientes/reportar/accion';

        const mapaAcciones = {
            'Actualizar reporte': 'ACTUALIZAR',
            'Dar por realizado': 'REALIZADO',
            'Desestimar reporte': 'DESESTIMAR',
            'Desestimar': 'DESESTIMAR',
            'INICIAR': 'INICIAR',
            'Volver': 'VOLVER',
            'Cancelar': 'CANCELAR'
        };

        function enviarAccion(accionSeleccionada) {
            // Limpiar la interfaz (si tiene TEXTO:, mostramos solo el contenido)
            const mensajePantalla = accionSeleccionada.startsWith('TEXTO:')
                ? accionSeleccionada.replace('TEXTO:', '')
                : accionSeleccionada;

            agregarMensaje(mensajePantalla, 'usuario');
            document.getElementById('chat-botones').innerHTML = '<p class="text-slate-500 font-bold animate-pulse">Analizando...</p>';

            const formData = new URLSearchParams();
            formData.append('idPedido', pedidoId);

            // Traducción para Java (si es texto libre, pasa intacto)
            let codigoAccionBackend = mapaAcciones[accionSeleccionada] || accionSeleccionada;
            if (accionSeleccionada.startsWith('TEXTO:')) {
                codigoAccionBackend = accionSeleccionada;
            }
            formData.append('accion', codigoAccionBackend);

            fetch(urlBase, {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: formData
            })
                .then(response => {
                    if (!response.ok) throw new Error('Error HTTP: ' + response.status);
                    return response.json();
                })
                .then(data => {
                    agregarMensaje(data.mensaje, 'sistema');

                    let botonesHTML = '';

                    // --- AQUÍ SE INYECTA EL INPUT DINÁMICAMENTE ---
                    if (data.mensaje.includes('escribe el detalle adicional')) {
                        botonesHTML += `
                            <div class="w-full mb-4 flex gap-2">
                                <input type="text" id="input-chat-texto"
                                       class="flex-1 px-4 py-2.5 rounded-lg border-2 border-blue-200 focus:outline-none focus:border-blue-500 transition text-slate-700"
                                       placeholder="Escribe el nuevo detalle aquí..."
                                       onkeypress="if(event.key === 'Enter') enviarTextoLibre()" />
                                <button onclick="enviarTextoLibre()"
                                        class="bg-blue-600 hover:bg-blue-700 text-white font-bold px-6 py-2.5 rounded-lg shadow transition">
                                    Enviar
                                </button>
                            </div>
                        `;
                    }

                    if (data.opciones && data.opciones.length > 0) {
                        data.opciones.forEach(opcion => {
                            botonesHTML += `<button onclick="enviarAccion('${opcion}')" class="bg-slate-200 hover:bg-slate-300 text-slate-800 font-bold px-4 py-2 rounded-lg border border-slate-300 transition shadow-sm">${opcion}</button>`;
                        });
                    } else {
                        botonesHTML = '<p class="text-emerald-600 font-black uppercase tracking-wide">El reporte ha sido cerrado.</p>';
                        setTimeout(() => window.location.href = '/portal/clientes/perfil', 3000);
                    }

                    document.getElementById('chat-botones').innerHTML = botonesHTML;

                    // Autofocus para que el usuario pueda tipear instantáneamente
                    const inputElem = document.getElementById('input-chat-texto');
                    if (inputElem) inputElem.focus();

                    scrollAlFondo();
                })
                .catch(error => {
                    console.error('Fallo en la comunicación:', error);
                    document.getElementById('chat-botones').innerHTML = '<p class="text-red-600 font-bold">Ocurrió un error en la conexión.</p>';
                });
        }

        // Función auxiliar que lee el texto del input y lo dispara con el prefijo TEXTO:
        function enviarTextoLibre() {
            const input = document.getElementById('input-chat-texto');
            if (!input || input.value.trim() === '') return;
            enviarAccion('TEXTO:' + input.value.trim());
        }

        function agregarMensaje(texto, emisor) {
            const div = document.createElement('div');
            if (emisor === 'usuario') {
                div.className = 'text-right bg-slate-800 text-white font-medium p-3 rounded-xl rounded-tr-none ml-auto w-5/6 shadow-md';
            } else {
                div.className = 'text-left bg-blue-50 text-blue-900 border border-blue-100 font-medium p-3 rounded-xl rounded-tl-none w-5/6 shadow-md';
            }
            div.innerText = texto;
            document.getElementById('chat-historial').appendChild(div);
            scrollAlFondo();
        }

        function scrollAlFondo() {
            const historial = document.getElementById('chat-historial');
            historial.scrollTop = historial.scrollHeight;
        }
    </script>
</div>
</body>
</html>
