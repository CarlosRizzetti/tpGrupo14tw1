<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layouts/app :: layout(~{::content}, _, ~{::header_center}, _, _, ~{::scripts})}">
<head>
    <title>Portal de Clientes / MCD</title>
</head>
<body>

<div th:fragment="header_center">
    <span class="text-puesto-header-text font-bold uppercase tracking-widest">Portal de Clientes</span>
</div>

<div th:fragment="content" class="p-6 flex flex-col items-center justify-center min-h-[calc(100vh-7rem)]">
    <div class="w-full max-w-md bg-puesto-btn text-puesto-btn-text p-8 rounded-3xl border-b-[8px] border-puesto-btn-border shadow-2xl relative">
        <div class="text-center mb-6">
            <h2 class="text-3xl font-black uppercase tracking-tighter mb-2">Mis Pedidos</h2>
            <p class="text-sm opacity-80 font-medium">Seguimiento e Historial MCD</p>
        </div>

        <div th:if="${error != null}" id="error-container" class="mb-6 p-4 bg-red-100/90 border-l-4 border-red-500 text-red-800 rounded shadow-inner">
            <span class="font-bold text-sm" th:text="${error}"></span>
        </div>

        <form th:action="@{/portal/clientes/procesar}" method="POST" class="space-y-4">
            <div>
                <label for="identificador" class="block text-xs font-bold uppercase tracking-wider mb-1.5">Correo Electrónico o DNI</label>
                <input name="identificador" id="identificador" type="text"
                       class="w-full px-4 py-3 rounded-xl text-black bg-white focus:ring-4 focus:ring-puesto-btn-border outline-none transition-shadow font-bold text-sm"
                       placeholder="Ej: cliente@correo.com o 38492012" required />
            </div>

            <div>
                <label for="password" class="block text-xs font-bold uppercase tracking-wider mb-1.5">Contraseña</label>
                <input name="password" id="password" type="password"
                       class="w-full px-4 py-3 rounded-xl text-black bg-white focus:ring-4 focus:ring-puesto-btn-border outline-none transition-shadow font-bold text-sm"
                       placeholder="••••••••" required />
            </div>

            <button id="btn-login-cliente" type="submit"
                    class="w-full py-3.5 mt-4 bg-puesto-header text-puesto-header-text font-black uppercase tracking-widest text-base rounded-xl hover:opacity-90 transition-all border-b-4 border-black/20 hover:-translate-y-1 hover:shadow-xl">
                Iniciar Sesión
            </button>
        </form>

        <div class="my-6 flex items-center">
            <div class="flex-grow border-t border-black/20"></div>
            <span class="px-3 text-xs uppercase tracking-wider font-bold opacity-60">o</span>
            <div class="flex-grow border-t border-black/20"></div>
        </div>

        <!-- BOTÓN DE GOOGLE -->
        <a th:href="@{/portal/clientes/google-login}"
           class="w-full py-3 px-4 bg-white text-slate-800 font-extrabold rounded-xl shadow hover:bg-slate-50 transition-all flex items-center justify-center border border-slate-200 text-sm hover:-translate-y-0.5">
            <svg class="h-5 w-5 mr-3" viewBox="0 0 24 24">
                <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
                <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
            </svg>
            Continuar con Google
        </a>

        <div class="mt-8 pt-6 border-t border-black/10 text-center">
            <p class="text-xs font-bold uppercase tracking-wider opacity-80 mb-3">¿Aún no tienes cuenta en el Portal?</p>
            <a th:href="@{/portal/clientes/registro}"
               class="w-full block py-3.5 px-4 bg-blue-600 text-white font-black uppercase tracking-widest text-sm rounded-xl hover:bg-blue-700 transition-all border-b-4 border-blue-800 shadow-md hover:-translate-y-0.5 text-center">
                Regístrate Gratis
            </a>
        </div>

    </div>
</div>

</body>
<div th:fragment="scripts"></div>
</html>
