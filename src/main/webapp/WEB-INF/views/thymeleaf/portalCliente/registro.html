<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layouts/app :: layout(~{::content}, _, ~{::header_center}, _, _, ~{::scripts})}">
<head>
    <title>Registro Portal de Clientes / MCD</title>
</head>
<body>

<div th:fragment="header_center">
    <span class="text-puesto-header-text font-bold uppercase tracking-widest">Registro de Clientes</span>
</div>

<div th:fragment="content" class="p-6 flex flex-col items-center justify-center min-h-[calc(100vh-7rem)] my-6">
    <div class="w-full max-w-lg bg-puesto-btn text-puesto-btn-text p-8 rounded-3xl border-b-[8px] border-puesto-btn-border shadow-2xl relative">
        <div class="text-center mb-6">
            <h2 class="text-3xl font-black uppercase tracking-tighter mb-1">Crear Cuenta</h2>
            <p class="text-xs opacity-85 font-medium">Sumate para gestionar tus pedidos y alertas de vencimiento al instante.</p>
        </div>

        <div th:if="${error != null}" class="mb-6 p-4 bg-red-100/90 border-l-4 border-red-500 text-red-800 rounded-xl shadow-inner">
            <span class="font-bold text-sm" th:text="${error}"></span>
        </div>

        <form th:action="@{/portal/clientes/registro-procesar}" th:object="${cliente}" method="POST" class="space-y-4">
            
            <div>
                <label for="nombre" class="block text-xs font-bold uppercase tracking-wider mb-1.5">Nombre Completo</label>
                <input th:field="*{nombre}" id="nombre" type="text"
                       class="w-full px-4 py-3 rounded-xl text-black bg-white focus:ring-4 focus:ring-puesto-btn-border outline-none transition-shadow font-bold text-sm"
                       placeholder="Ej: Damián García" required />
            </div>

            <div>
                <label for="email" class="block text-xs font-bold uppercase tracking-wider mb-1.5">Correo Electrónico</label>
                <input th:field="*{email}" id="email" type="email"
                       class="w-full px-4 py-3 rounded-xl text-black bg-white focus:ring-4 focus:ring-puesto-btn-border outline-none transition-shadow font-bold text-sm"
                       placeholder="Ej: damian@correo.com" required />
            </div>

            <div>
                <label for="password" class="block text-xs font-bold uppercase tracking-wider mb-1.5">Contraseña</label>
                <input th:field="*{password}" id="password" type="password"
                       class="w-full px-4 py-3 rounded-xl text-black bg-white focus:ring-4 focus:ring-puesto-btn-border outline-none transition-shadow font-bold text-sm"
                       placeholder="••••••••" required />
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label for="documento" class="block text-xs font-bold uppercase tracking-wider mb-1.5">Número de DNI</label>
                    <input th:field="*{documento}" id="documento" type="text"
                           class="w-full px-4 py-3 rounded-xl text-black bg-white focus:ring-4 focus:ring-puesto-btn-border outline-none transition-shadow font-bold text-sm"
                           placeholder="Ej: 38492012" pattern="[0-9]{8}" minlength="8" maxlength="8"
                           title="Debe ingresar exactamente 8 dígitos numéricos."
                           oninvalid="this.setCustomValidity('Por favor, ingresa tu DNI sin puntos ni espacios.')"
                           oninput="this.setCustomValidity('')" required />
                </div>

                <div>
                    <label for="telefono" class="block text-xs font-bold uppercase tracking-wider mb-1.5">Teléfono</label>
                    <input th:field="*{telefono}" id="telefono" type="tel"
                           class="w-full px-4 py-3 rounded-xl text-black bg-white focus:ring-4 focus:ring-puesto-btn-border outline-none transition-shadow font-bold text-sm"
                           placeholder="Ej: 1149201923" pattern="[0-9]{10}" minlength="10" maxlength="10"
                           title="Debe ingresar exactamente 10 dígitos numéricos."
                           oninvalid="this.setCustomValidity('Por favor, ingresa tu teléfono celular (código de área + número).')"
                           oninput="this.setCustomValidity('')" required />
                </div>
            </div>

            <button id="btn-registrar-cliente" type="submit"
                    class="w-full py-4 mt-6 bg-puesto-header text-puesto-header-text font-black uppercase tracking-widest text-base rounded-xl hover:opacity-90 transition-all border-b-4 border-black/20 hover:-translate-y-1 hover:shadow-xl">
                Registrarme
            </button>
        </form>

        <div class="mt-8 pt-6 border-t border-black/10 text-center">
            <p class="text-xs font-bold uppercase tracking-wider opacity-80 mb-3">¿Ya tienes una cuenta registrada?</p>
            <a th:href="@{/portal/clientes}"
               class="w-full block py-3.5 px-4 bg-blue-600 text-white font-black uppercase tracking-widest text-sm rounded-xl hover:bg-blue-700 transition-all border-b-4 border-blue-800 shadow-md hover:-translate-y-0.5 text-center">
                Iniciar Sesión
            </a>
        </div>

    </div>
</div>

</body>
<div th:fragment="scripts"></div>
</html>
