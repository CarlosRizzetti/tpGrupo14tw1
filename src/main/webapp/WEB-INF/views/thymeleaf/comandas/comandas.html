<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>

<div th:replace="~{layouts/app :: layout(~{::content}, ~{::header_left}, ~{::header_center}, ~{::header_right}, _, ~{::scripts})}">

    <div th:fragment="header_left">
        <a th:href="@{/cocina/comandas}"
           class="flex items-center px-4 py-2 bg-black/10 hover:bg-black/20 rounded-lg font-bold uppercase text-xs border border-white/20 transition text-white">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/>
            </svg>
            Cambiar Categoría
        </a>
    </div>

    <div th:fragment="header_center">
        <span class="text-puesto-header-text font-bold uppercase tracking-widest">
            Comandas — <span th:text="${categoria.nombre}">Cocina</span>
        </span>
    </div>

    <div th:fragment="header_right">
        <span class="text-xs uppercase tracking-widest opacity-80 flex items-center gap-2">
            <span class="inline-block w-2 h-2 rounded-full bg-green-400 animate-pulse"></span>
            En vivo
        </span>
    </div>

    <div th:fragment="content" class="p-6">
        <div th:attr="data-id-categoria=${categoria.id}" data-comandas-root>


            <div data-estado-vacio class="hidden text-center py-24">
                <div class="mx-auto w-20 h-20 rounded-full bg-white flex items-center justify-center mb-4 shadow-lg">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-10 h-10 text-slate-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/>
                    </svg>
                </div>
                <p class="text-2xl font-black text-slate-600 uppercase tracking-widest">Sin comandas pendientes</p>
                <p class="text-sm text-slate-400 mt-1">Cuando entre un pedido nuevo, aparece acá.</p>
            </div>

            <!-- Grilla de cards -->
            <div data-grilla-comandas class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5"></div>
        </div>

        <!-- Modal de faltantes de timer -->
        <div data-modal-faltantes class="hidden fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4">
            <div class="bg-white rounded-2xl shadow-2xl max-w-md w-full p-6">
                <div class="flex items-start gap-4 mb-4">
                    <div class="w-12 h-12 rounded-full bg-red-100 text-red-600 flex items-center justify-center flex-shrink-0">
                        <svg xmlns="http://www.w3.org/2000/svg" class="w-7 h-7" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m9-.75a9 9 0 1 1-18 0 9 9 0 0 1 18 0Zm-9 3.75h.008v.008H12v-.008Z"/>
                        </svg>
                    </div>
                    <div class="flex-1">
                        <h2 class="text-xl font-black text-slate-900 uppercase">No hay timers activos</h2>
                        <p class="text-sm text-slate-500 mt-1">
                            No podés sacar esta comanda. Necesitás generar un timer para:
                        </p>
                    </div>
                </div>

                <ul data-lista-faltantes class="list-disc list-inside space-y-1 text-slate-700 font-semibold mb-6 pl-4"></ul>

                <div class="flex justify-end">
                    <button type="button" data-cerrar-modal
                            class="px-6 py-2 bg-slate-800 text-white rounded-md font-semibold hover:bg-slate-900 transition">
                        Entendido
                    </button>
                </div>
            </div>
        </div>
    </div>


    <th:block th:fragment="scripts">
        <script type="module" th:src="@{/resources/core/js/comandas.js}"></script>
    </th:block>
</div>

</body>
</html>
