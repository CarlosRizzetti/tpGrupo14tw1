<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>


<div th:replace="~{layouts/app :: layout(~{::content}, ~{::header_left}, ~{::header_center}, ~{::header_right}, _, _)}">

    <div th:fragment="header_left">
        <a th:href="@{/home}"
           class="flex items-center px-4 py-2 bg-black/10 hover:bg-black/20 rounded-lg font-bold uppercase text-xs border border-white/20 transition text-white">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/>
            </svg>
            Volver
        </a>
    </div>


    <div th:fragment="header_center">
        <span class="text-puesto-header-text font-bold uppercase tracking-widest">
            Comandas — Seleccioná una Categoría
        </span>
    </div>


    <div th:fragment="header_right">
        <a th:href="@{/}"
           class="md:flex items-center px-4 py-2 bg-black/10 hover:bg-black/20 rounded-lg border border-white/20 transition text-xs font-bold uppercase tracking-wider">
            Gestión de Timers
        </a>
    </div>


    <div th:fragment="content" class="p-6">

        <div th:if="${#lists.isEmpty(categorias)}"
             class="p-6 bg-red-100 border-l-4 border-red-500 text-red-700 rounded-lg shadow-inner text-center font-bold text-xl mb-8">
            <p>No tenés categorías habilitadas para atender comandas.</p>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 md:gap-6 pb-10">
            <a th:each="entrada : ${categorias}"
               th:href="@{/cocina/comandas/categoria/{id}(id=${entrada.categoria.id})}"
               th:classappend="' ' + ${entrada.categoria.tema}"
               class="group relative flex flex-row items-center justify-between p-6 bg-puesto-btn text-puesto-btn-text border-l-[10px] border-puesto-btn-border rounded-2xl shadow-xl hover:shadow-2xl transition-all duration-200 hover:translate-x-1 min-h-[140px]">

                <!-- Bloque icono + nombre -->
                <div class="flex items-center gap-5">
                    <div class="text-puesto-accent">
                        <img th:src="@{${entrada.categoria.icono}}"
                             class="h-16 w-16 md:h-20 md:w-20 object-contain"
                             alt="icono"/>
                    </div>
                    <div>
                        <p class="text-xs uppercase tracking-widest opacity-70">Comandas</p>
                        <span class="text-3xl md:text-4xl font-black uppercase tracking-tighter"
                              th:text="${entrada.categoria.nombre}">
                        </span>
                    </div>
                </div>


                <div class="flex flex-col items-end gap-1">
                    <span th:if="${entrada.comandasPendientes > 0}"
                          class="flex items-center justify-center min-w-[3.5rem] h-14 px-3 rounded-full bg-red-600 text-white text-2xl font-black shadow-lg animate-pulse"
                          th:text="${entrada.comandasPendientes}">
                        0
                    </span>
                    <span th:if="${entrada.comandasPendientes == 0}"
                          class="flex items-center justify-center min-w-[3.5rem] h-14 px-3 rounded-full bg-white/40 text-puesto-btn-text text-2xl font-black">
                        0
                    </span>
                    <span class="text-[9px] uppercase tracking-widest opacity-70">Pendientes</span>
                </div>
            </a>
        </div>
    </div>
</div>

</body>
</html>
