<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layouts/app :: layout(~{::content}, ~{::header_left}, ~{::header_center}, ~{::header_right}, ~{}, ~{::scripts})}">

<head>
    <title>Configurar Vencimiento</title>
</head>

<body>

<div th:fragment="header_left" th:remove="tag">
    <a th:href="@{/category/{id}/products(id=${categoria.id})}" class="flex items-center px-4 py-2 bg-black/10 hover:bg-black/20 rounded-lg font-bold uppercase text-xs border border-white/20 transition">
    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 mr-1" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M15 19l-7-7 7-7" />
    </svg>
    Volver
    </a>
</div>

<div th:fragment="header_center" th:remove="tag">
    <div class="flex flex-col">
        <span class="block text-[10px] font-bold opacity-70 uppercase tracking-widest leading-none mb-1">Configurar Vencimiento</span>
        <h2 class="text-2xl md:text-3xl font-black uppercase italic tracking-tighter leading-none"
            th:text="${producto.nombre}">
            LECHE
        </h2>
    </div>
</div>

<div th:fragment="header_right">
    <a th:href="@{/dashboard}"
       class="hidden md:flex items-center px-4 py-2 bg-black/10 hover:bg-black/20 rounded-lg border border-white/20 transition text-xs font-bold uppercase tracking-wider">
        Dashboard
    </a>
</div>

<div th:fragment="content" th:remove="tag">
    <div class="p-4">
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6 pb-20">

            <div th:each="rule : ${reglas}" class="bg-white rounded-[2rem] shadow-xl overflow-hidden flex flex-col border border-gray-100">

                <form th:action="@{/producto/{id}/generar(id=${producto.id})}"
                      method="POST"
                      class="form flex flex-col h-full"
                      th:id="'form-' + ${rule.id}">

                    <input type="hidden" name="reglaId" th:value="${rule.id}">
                    <input type="hidden" name="offset_minutes" th:id="'final-' + ${rule.id}" value="0">
                    <input type="hidden" name="categoryId" th:value="${categoria.id}">

                    <div class="bg-gray-800 text-white p-4 text-center min-h-[60px] flex items-center justify-center">
                        <h3 class="text-base uppercase tracking-wider line-clamp-2 px-2"
                            th:text="${rule.ubicacion}">Ubicación</h3>
                    </div>

                    <div class="p-6 flex-grow space-y-6">


                        <div class="bg-gray-50/80 p-5 rounded-3xl border border-gray-100 space-y-4">
                            <label th:for="'unit-' + ${rule.id}" class="block text-[9px] font-bold text-gray-400 uppercase text-center tracking-widest italic">
                                ¿Hace cuánto se elaboró?
                            </label>

                            <div class="flex flex-col gap-3">
                                <select class="vencimiento-select w-full text-center text-xs font-black bg-white border-2 border-gray-200 rounded-2xl p-3 uppercase focus:outline-none focus:border-gray-400 transition-all text-gray-700 tracking-wider"
                                        th:data-id="${rule.id}"
                                        th:id="'unit-' + ${rule.id}"
                                        th:name="'unit-' + ${rule.id}">
                                    <option value="1">Restar Minutos</option>
                                    <option value="60">Restar Horas</option>
                                    <option value="1440">Restar Días</option>
                                    <option value="custom">Elegir Fecha Exacta</option>
                                </select>

                                <div th:id="'numeric-container-' + ${rule.id}" class="relative">
                                    <input type="number" th:id="'val-' + ${rule.id}" value="0" min="0"
                                           class="w-full text-center text-4xl font-black bg-white border-2 border-gray-200 rounded-2xl p-3 focus:outline-none focus:border-gray-400 text-gray-800">
                                    <span class="absolute right-4 top-1/2 -translate-y-1/2 text-gray-300 font-bold text-[10px] uppercase tracking-wider italic">Tiempo</span>
                                </div>

                                <div th:id="'date-container-' + ${rule.id}" class="hidden">
                                    <input type="datetime-local" th:id="'date-' + ${rule.id}"
                                           class="w-full text-center text-xl font-black bg-white border-2 border-gray-200 rounded-2xl p-3 focus:outline-none focus:border-gray-400 text-gray-800">
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="p-4 bg-gray-50/50">
                        <button type="submit"
                                class="w-full py-4 bg-puesto-btn text-puesto-btn-text border-b-[6px] border-puesto-btn-border rounded-2xl text-xl font-black uppercase tracking-wider active:border-b-0 active:translate-y-1.5 transition-all flex items-center justify-center gap-3 shadow-md hover:opacity-95">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 opacity-60" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 00-2 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z" />
                            </svg>
                            IMPRIMIR
                        </button>
                    </div>
                </form>
            </div>

        </div>
    </div>

</div>

<div th:fragment="scripts">
<script th:src="@{/resources/core/js/generarVencimientoFunciones.js}" defer></script>
</div>
