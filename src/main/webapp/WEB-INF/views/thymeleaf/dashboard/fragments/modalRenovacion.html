<div th:fragment="modalRenovacion"
     id="renew-modal"
     class="fixed inset-0 z-50 hidden"
     aria-labelledby="modal-title"
     role="dialog"
     aria-modal="true">

    <div class="fixed inset-0 bg-gray-900 bg-opacity-75 transition-opacity backdrop-blur-sm"></div>

    <div class="fixed inset-0 z-10 overflow-y-auto">
        <div class="flex min-h-full items-center justify-center p-4 text-center sm:p-0">

            <div class="relative transform overflow-hidden rounded-2xl bg-white text-left shadow-2xl transition-all sm:my-8 sm:w-full sm:max-w-lg border-t-8 border-slate-500"
                 style="min-height: 420px;">
                <div id="renew-step-1">

                    <!-- Cabecera -->
                    <div class="bg-gray-50 px-4 py-5 sm:px-6 flex justify-between items-center border-b border-gray-100">
                        <h3 class="text-xl font-black leading-6 text-gray-800 uppercase italic tracking-tighter" id="renew-title">
                            Renovar Vencimiento
                        </h3>
                        <button th:data-action="closeRenewModal"
                                type="button"
                                class="btn-action-close text-gray-400 hover:text-gray-500 transition-colors">
                            <svg class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/>
                            </svg>
                        </button>
                    </div>

                    <!-- Cuerpo -->
                    <div class="px-4 py-6 sm:p-6">
                        <input type="hidden" id="renew-timer-id">
                        <input type="hidden" id="renew-cantidad-timer">
                        <!-- Tarjeta resumen del producto -->
                        <div class="bg-blue-50 border border-blue-100 rounded-xl p-4 mb-6 text-center">
                            <span class="block text-[10px] font-bold text-blue-400 uppercase tracking-widest mb-1">Producto a Renovar</span>
                            <h4 id="renew-product-name" class="text-2xl font-black text-gray-800 uppercase leading-none mb-2">---</h4>
                            <div class="inline-flex items-center gap-1 bg-white px-3 py-1 rounded-full border border-blue-100 shadow-sm">
                                <svg class="w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/>
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/>
                                </svg>
                                <span id="renew-product-location" class="text-xs font-bold text-gray-500 uppercase">---</span>
                            </div>
                            <div class="bg-green-50 border border-green-100 rounded-xl p-4 mb-6 text-center">
                                <span class="block text-[10px] font-bold text-green-500 uppercase tracking-widest mb-1">Stock de produto a renovar</span>
                                <span id="renew-cantidad-main" class="text-4xl font-black text-gray-800">0</span>
                            </div>
                        </div>

                    <!-- Footer: 2 botones de acción -->
                    <div class="bg-gray-50 px-4 py-4 sm:px-6 border-t border-gray-100">
                        <div class="grid grid-cols-2 gap-3">
                            <!-- Renovar totalidad -->
                            <button id="btn-renew-total"
                                    type="button"
                                    class="flex flex-col items-center justify-center gap-1 rounded-xl bg-slate-700 hover:bg-slate-800 text-white px-3 py-3 text-[11px] font-black uppercase tracking-wide transition-all active:scale-95 leading-tight text-center">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
                                </svg>
                                Renovar la<br>misma cantidad de producto
                            </button>

                            <!-- Renovar cantidad personalizada -->
                            <button id="btn-renew-custom"
                                    type="button"
                                    class="flex flex-col items-center justify-center gap-1 rounded-xl bg-blue-600 hover:bg-blue-700 text-white px-3 py-3 text-[11px] font-black uppercase tracking-wide transition-all active:scale-95 leading-tight text-center">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/>
                                </svg>
                                Renovar otra cantidad<br>personalizada
                            </button>
                        </div>
                    </div>
                </div>

                <!-- ========================== -->
                <!-- PASO 2: CANTIDAD CUSTOM   -->
                <!-- ========================== -->
                <div id="renew-step-2"
                     class="absolute inset-0 bg-white rounded-2xl flex flex-col"
                     style="transform: translateX(100%); transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1); will-change: transform;">

                    <!-- Cabecera paso 2 -->
                    <div class="bg-gray-50 px-4 py-5 sm:px-6 flex justify-between items-center border-b border-gray-100 rounded-t-2xl">
                        <div class="flex items-center gap-3">
                            <!-- Botón volver -->
                            <button id="btn-renew-back-step1"
                                    type="button"
                                    class="text-gray-400 hover:text-gray-600 transition-colors">
                                <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/>
                                </svg>
                            </button>
                            <h3 class="text-xl font-black leading-6 text-gray-800 uppercase italic tracking-tighter">
                                ¿Cuántos productos<br>vas a llevarte?
                            </h3>
                        </div>
                        <!-- Botón cerrar -->
                        <button th:data-action="closeRenewModal"
                                type="button"
                                class="btn-action-close text-gray-400 hover:text-gray-500 transition-colors">
                            <svg class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/>
                            </svg>
                        </button>
                    </div>

                    <!-- Cuerpo paso 2 -->
                    <div class="flex-grow px-4 py-6 sm:p-6 flex flex-col justify-center">

                        <!-- Badge disponible -->
                        <div class="bg-green-50 border border-green-100 rounded-xl p-4 mb-6 text-center">
                            <span class="block text-[10px] font-bold text-green-500 uppercase tracking-widest mb-1">Stock disponible para renovar</span>
                            <span id="modal-renew-cantidad-badge" class="text-4xl font-black text-gray-800">0</span>
                            <span class="text-lg font-black text-gray-400 ml-1"></span>
                        </div>

                        <!-- Input número -->
                        <label class="block text-xs font-black text-gray-500 uppercase tracking-widest mb-2 text-center">
                            Cantidad a renovar
                        </label>
                        <input type="number"
                               id="modal-renew-cantidad-input"
                               min="1"
                               class="w-full border-2 border-gray-200 rounded-xl px-4 py-4 text-3xl font-black text-gray-800 text-center focus:outline-none focus:border-blue-400 transition-colors"
                               placeholder="0">
                        <p id="modal-renew-cantidad-error" class="text-xs font-bold text-red-500 uppercase mt-2 text-center hidden">
                            Ingresá una cantidad válida
                        </p>
                    </div>

                    <!-- Footer paso 2 -->
                    <div class="bg-gray-50 px-4 py-4 sm:px-6 border-t border-gray-100 rounded-b-2xl">
                        <button id="btn-renew-confirm-custom-import"
                                type="button"
                                class="w-full flex items-center justify-center gap-2 rounded-xl bg-blue-600 hover:bg-blue-700 text-white px-4 py-3 text-sm font-black uppercase tracking-wide transition-all active:scale-95">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/>
                            </svg>
                            Renovar vencimiento
                        </button>
                    </div>
                </div>

            </div>
        </div>
    </div>
</div>
</div>
