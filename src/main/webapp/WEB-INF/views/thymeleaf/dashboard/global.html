<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layouts/app :: layout(
        ~{::content},
        ~{::header_left},
        ~{::header_center},
        ~{::header_right},
        ~{},
        ~{::scripts}
      )}">

<head>
    <title>Dashboard Global</title>
</head>

<!-- HEADER LEFT -->
<div th:fragment="header_left"></div>

<!-- HEADER CENTER -->
<div th:fragment="header_center">
    <h1 class="text-puesto-header-text font-bold uppercase tracking-widest">
        Panel de Control Global
    </h1>
</div>

<!-- HEADER RIGHT -->
<div th:fragment="header_right">
    <a th:href="@{/home.html}"
       class="hidden md:flex items-center px-4 py-2 bg-black/10 hover:bg-black/20 rounded-lg border border-white/20 transition text-xs font-bold uppercase tracking-wider">
        Volver
    </a>
</div>

<!-- CONTENT -->
<div th:fragment="content" class="min-h-screen font-sans">

    <!-- LOOP CATEGORIAS -->
    <div th:each="categoria : ${categorias}">

        <!-- SECCION -->
        <section th:classappend="${categoria.tema}"
            class="px-8 py-8 bg-[var(--bg-app)] transition-colors duration-300 border-b border-black/10">

            <!-- TOP -->
            <div class="flex items-center justify-between mb-6">

                <!-- IZQUIERDA -->
                <div class="flex items-center gap-4">

                    <h2 class="text-4xl md:text-5xl font-black uppercase italic tracking-tight text-black"
                        th:text="${categoria.nombre}">
                        Categoria
                    </h2>

                    <!-- ACTIVOS -->
                    <div class="px-4 py-1 rounded-full text-white text-xs font-black uppercase"
                        style="background-color: var(--bg-header); color: var(--text-header);">

                        <span th:text="${#lists.size(timersPorCategoria[categoria.id])}">
                            0
                        </span>

                        activos
                    </div>

                </div>

                <!-- DERECHA -->
                <span class="hidden md:block text-xs uppercase tracking-[0.4em] text-gray-400 font-bold">

                    Área de control:
                    <span th:text="${categoria.nombre}"></span>

                </span>

            </div>

            <!-- LINEA -->
            <div class="h-1 mb-8" style="background-color: var(--bg-header);">
            </div>

            <!-- VACIO -->
            <div th:if="${#lists.isEmpty(timersPorCategoria[categoria.id])}"
                class="border-2 border-dashed border-gray-300 rounded-3xl h-48 flex items-center justify-center">

                <p class="text-gray-400 uppercase tracking-widest font-black italic text-center">
                    No hay producciones activas en esta área
                </p>

            </div>

            <!-- GRID -->
            <div th:if="${!#lists.isEmpty(timersPorCategoria[categoria.id])}"
                class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-4 gap-6">

                <!-- CARD -->
                <div th:each="timer : ${timersPorCategoria[categoria.id]}" th:id="'timer-' + ${timer.id}"
                    class="bg-white rounded-2xl shadow-xl overflow-hidden flex flex-col border-b-[6px]"
                    th:data-vencimiento="${timer.fechaVencimiento}" th:data-elaboracion="${timer.fechaCreacion}"
                    style="border-color: var(--bg-header);">

                    <!-- BODY -->
                    <div class="p-5 flex-grow">

                        <!-- NOMBRE -->
                        <div class="mb-2">

                            <h3 class="text-2xl font-black uppercase leading-tight text-gray-800"
                                th:id="'nombre-' + ${timer.id}" th:text="${timer.nombre}">
                                Producto
                            </h3>

                            <span class="text-[10px] uppercase tracking-widest text-gray-400 font-bold"
                                th:id="'ubicacion-' + ${timer.id}" th:text="${timer.ubicacion}">
                                ubicación
                            </span>

                        </div>

                        <!-- TIMER -->
                        <div class="mt-6 mb-6 rounded-xl py-8 text-center bg-puesto-soft border border-black/5">

                            <span th:id="'display-' + ${timer.id}"
                                class="timer-display text-5xl font-black font-mono tabular-nums"
                                style="color: var(--bg-header);">

                                00:00:00

                            </span>

                            <div class="text-[10px] uppercase tracking-widest text-gray-400 font-bold mt-2">
                                tiempo restante
                            </div>

                        </div>

                        <!-- FECHAS -->
                        <div
                            class="grid grid-cols-2 gap-4 text-[10px] uppercase font-bold text-gray-400 border-t border-gray-100 pt-4">

                            <div>
                                ELAB:

                                <span class="block text-gray-700" th:id="'elab-' + ${timer.id}"
                                    th:text="${timer.fechaCreacion}">
                                    12:00
                                </span>
                            </div>

                            <div class="text-right">
                                VENCE:

                                <span class="block" th:id="'vence-' + ${timer.id}" th:text="${timer.fechaVencimiento}"
                                    style="color: var(--bg-header);">

                                    14:00

                                </span>
                            </div>

                        </div>

                    </div>

                    <!-- BOTONES -->
                    <div class="grid grid-cols-2 h-16 border-t border-gray-100">

                        <!-- ELIMINAR -->
                        <button type="button" th:data-timer-id="${timer.id}"
                            class="bg-red-600 hover:bg-red-700 text-white flex flex-col items-center justify-center transition-colors">

                            <span class="text-[10px] font-black uppercase">
                                Eliminar
                            </span>

                        </button>

                        <!-- RENOVAR -->
                        <button type="button" th:data-timer-id="${timer.id}"
                            class="flex flex-col items-center justify-center transition-colors" style="
                                    background-color: var(--btn-bg);
                                    color: var(--btn-text);
                                ">

                            <span class="text-[10px] font-black uppercase">
                                Renovar
                            </span>

                        </button>

                    </div>

                </div>

            </div>

        </section>

    </div>

</div>

<!-- SCRIPTS -->
<div th:fragment="scripts">

    <script type="module" th:src="@{/resources/core/js/actualizarTemporizadores.js}" defer>
    </script>

    <script th:src="@{/resources/core/js/deleteTimer.js}" defer>
    </script>

</div>

</html>
