<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layouts/app :: layout(
        ~{::content},
        ~{::header_left},
        ~{::header_center},
        ~{::header_right},
        ~{},
        ~{::scripts}
      )}">

<head>
    <title>Dashboard Global</title>
</head>

<!-- HEADER LEFT -->
<div th:fragment="header_left"></div>

<!-- HEADER CENTER -->
<div th:fragment="header_center">
    <h1 class="text-puesto-header-text font-bold uppercase tracking-widest">
        Panel de Control Global
    </h1>
</div>

<!-- HEADER RIGHT -->
<div th:fragment="header_right">
    <a th:href="@{/home.html}"
        class="hidden md:flex items-center px-4 py-2 bg-black/10 hover:bg-black/20 rounded-lg border border-white/20 transition text-xs font-bold uppercase tracking-wider">
        Volver
    </a>
</div>

<!-- CONTENT -->
<div th:fragment="content" class="min-h-screen font-sans">

    <!-- LOOP CATEGORIAS -->
    <div th:each="categoria : ${categorias}">

        <!-- SECCION -->
        <section th:classappend="${categoria.tema}"
            class="px-8 py-8 bg-[var(--bg-app)] transition-colors duration-300 border-b border-black/10">

            <!-- TOP -->
            <div class="flex items-center justify-between mb-6">

                <!-- IZQUIERDA -->
                <div class="flex items-center gap-4">

                    <h2 class="text-4xl md:text-5xl font-black uppercase italic tracking-tight text-black"
                        th:text="${categoria.nombre}">
                        Categoria
                    </h2>

                    <!-- ACTIVOS -->
                    <div class="px-4 py-1 rounded-full text-white text-xs font-black uppercase"
                        style="background-color: var(--bg-header); color: var(--text-header);">

                        <span th:text="${#lists.size(timersPorCategoria[categoria.id])}">
                            0
                        </span>

                        activos
                    </div>

                </div>

                <!-- DERECHA -->
                <span class="hidden md:block text-xs uppercase tracking-[0.4em] text-gray-400 font-bold">

                    Área de control:
                    <span th:text="${categoria.nombre}"></span>

                </span>

            </div>

            <!-- LINEA -->
            <div class="h-1 mb-8" style="background-color: var(--bg-header);">
            </div>

            <!-- VACIO -->
            <div th:if="${#lists.isEmpty(timersPorCategoria[categoria.id])}"
                class="border-2 border-dashed border-gray-300 rounded-3xl h-48 flex items-center justify-center">

                <p class="text-gray-400 uppercase tracking-widest font-black italic text-center">
                    No hay producciones activas en esta área
                </p>

            </div>

            <!-- GRID -->
            <div th:if="${!#lists.isEmpty(timersPorCategoria[categoria.id])}"
                class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6 pb-20">

                <!-- CARD -->
                <div th:each="timer : ${timersPorCategoria[categoria.id]}" th:id="'timer-' + ${timer.id}"
                    class="timer bg-white rounded-2xl shadow-lg border-b-[6px] flex flex-col overflow-hidden transform transition-all active:scale-95"
                    style="border-color: var(--bg-header);" th:data-vencimiento="${timer.fechaVencimiento}"
                    th:data-elaboracion="${timer.fechaCreacion}">

                    <div class="p-5 flex-grow">

                        <div class="mb-1">
                            <h2 class="text-xl font-black text-gray-800 leading-tight uppercase"
                                th:id="'nombre-' + ${timer.id}" th:text="${timer.nombre}">
                                Nombre Producto
                            </h2>

                            <span class="text-[10px] font-bold text-gray-400 uppercase tracking-widest"
                                th:id="'ubicacion-' + ${timer.id}" th:text="${timer.ubicacion ?: 'General'}">
                                ubicacion
                            </span>
                        </div>

                        <!-- RELOJ -->
                        <div
                            class="mt-4 mb-4 py-6 rounded-xl bg-gray-50 border border-gray-200 flex flex-col items-center justify-center">

                            <span th:id="'display-' + ${timer.id}"
                                class="timer-display text-4xl font-mono font-black text-gray-700 tabular-nums">

                                00:00:00

                            </span>

                            <div class="text-[9px] font-bold text-gray-400 uppercase tracking-widest mt-1">
                                Tiempo restante
                            </div>

                        </div>

                        <!-- FECHAS -->
                        <div
                            class="grid grid-cols-2 gap-4 text-[10px] font-bold text-gray-400 uppercase border-t border-gray-100 pt-4">

                            <div>
                                Elab:
                                <span th:id="'elab-' + ${timer.id}" class="text-gray-800 block"
                                    th:text="${timer.fechaCreacion}">
                                    12:00
                                </span>
                            </div>

                            <div class="text-right">
                                Vence:
                                <span th:id="'vence-' + ${timer.id}" class="text-puesto-header block"
                                    th:text="${timer.fechaVencimiento}">
                                    14:00
                                </span>
                            </div>

                        </div>

                    </div>

                    <!-- BOTONERA -->
                    <div class="grid grid-cols-3 h-16 border-t border-gray-100 divide-x divide-gray-100">

                        <!-- Eliminar -->
                        <button type="button" th:data-timer-id="${timer.id}" th:data-category-id="${categoria.id}"
                            class="btn-eliminar bg-red-50 hover:bg-red-100 text-red-600 flex flex-col items-center justify-center transition-colors active:bg-red-200 group">

                            <svg class="w-5 h-5 mb-0.5 group-hover:scale-110" fill="none" stroke="currentColor"
                                viewBox="0 0 24 24">

                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16">
                                </path>

                            </svg>

                            <span class="text-[9px] font-black uppercase">
                                Eliminar
                            </span>

                        </button>

                        <!-- Importar -->
                        <button type="button" th:data-timer-id="${timer.id}" th:data-product-name="${timer.nombre}"
                            th:data-location="${timer.ubicacion ?: 'General'}"
                            class="btn-importar bg-slate-100 hover:bg-slate-200 text-slate-600 flex flex-col items-center justify-center transition-colors active:bg-slate-300 group z-10">

                            <svg class="w-5 h-5 mb-0.5 group-hover:scale-110" fill="none" stroke="currentColor"
                                viewBox="0 0 24 24">

                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4">
                                </path>

                            </svg>

                            <span class="text-[9px] font-black uppercase">
                                Importar
                            </span>

                        </button>

                        <!-- Renovar -->
                        <button type="button" th:data-timer-id="${timer.id}" th:data-category-id="${categoria.id}"
                            class="btn-renovar bg-puesto-btn text-puesto-btn-text flex flex-col items-center justify-center transition-all hover:brightness-105 group">

                            <svg class="w-5 h-5 mb-0.5 group-hover:rotate-180 transition-transform duration-500"
                                fill="none" stroke="currentColor" viewBox="0 0 24 24">

                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15">
                                </path>

                            </svg>

                            <span class="text-[9px] font-black uppercase">
                                Renovar
                            </span>

                        </button>

                    </div>

                </div>

            </div>

        </section>

    </div>

</div>

<!-- SCRIPTS -->
<div th:fragment="scripts">

    <script type="module" th:src="@{/resources/core/js/actualizarTemporizadores.js}" defer>
    </script>

    <script th:src="@{/resources/core/js/deleteTimer.js}" defer>
    </script>

</div>

</html>
