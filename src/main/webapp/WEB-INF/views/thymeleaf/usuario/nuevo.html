<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layouts/app :: layout(~{::content}, ~{::header_left}, ~{::header_center}, ~{::header_right}, ~{}, _)}">
<head>
    <title>Nuevo Usuario / MCD Vencimientos</title>
</head>
<body>

<div th:fragment="header_center">
    <span class="text-puesto-header-text font-bold uppercase tracking-widest">Nuevo Usuario</span>
</div>

<div th:fragment="header_left">
    <a th:href="@{/admin/usuarios}" class="flex items-center px-4 py-2 bg-black/10 hover:bg-black/20 rounded-lg font-bold uppercase text-xs border border-white/20 transition">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 mr-1" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M15 19l-7-7 7-7" />
        </svg>
        Volver
    </a>
</div>

<div th:fragment="header_right"></div>

<div th:fragment="content" class="p-6 flex flex-col items-center justify-center min-h-[calc(100vh-7rem)]">
    <div class="w-full max-w-md bg-puesto-btn text-puesto-btn-text p-8 rounded-3xl border-b-[8px] border-puesto-btn-border shadow-2xl">

        <div class="text-center mb-8">
            <h2 class="text-3xl font-black uppercase tracking-tighter mb-2">Crear Usuario</h2>
        </div>

        <div th:if="${error != null}" class="mb-6 p-4 bg-red-100/90 border-l-4 border-red-500 text-red-800 rounded shadow-inner">
            <span class="font-bold text-sm" th:text="${error}"></span>
        </div>

        <form th:action="@{/admin/usuarios/nuevo}" method="POST" th:object="${usuarioDto}" class="space-y-5">

            <div>
                <label for="email" class="block text-sm font-bold uppercase tracking-wider mb-2">Correo Electrónico</label>
                <input th:field="*{email}" id="email" type="email"
                       class="w-full px-5 py-4 rounded-xl text-black bg-white focus:ring-4 focus:ring-puesto-app outline-none transition-shadow"
                       placeholder="ejemplo@correo.com" required />
            </div>

            <div>
                <label for="password" class="block text-sm font-bold uppercase tracking-wider mb-2">Contraseña</label>
                <input th:field="*{password}" id="password" type="password"
                       class="w-full px-5 py-4 rounded-xl text-black bg-white focus:ring-4 focus:ring-puesto-app outline-none transition-shadow"
                       placeholder="********" required />
                <ul class="mt-2 text-xs font-bold opacity-80 pl-4 list-disc">
                    <li>6-10 caracteres</li>
                    <li>Al menos una mayúscula</li>
                    <li>Al menos un número</li>
                </ul>
            </div>

            <div>
                <label for="rol" class="block text-sm font-bold uppercase tracking-wider mb-2">Rol</label>
                <select th:field="*{rol}" id="rol"
                        class="w-full px-5 py-4 rounded-xl text-black bg-white focus:ring-4 focus:ring-puesto-app outline-none transition-shadow">
                    <option value="USER">Usuario</option>
                    <option value="ADMIN">Administrador</option>
                </select>
            </div>

            <button type="submit"
                    class="w-full py-4 mt-6 bg-puesto-header text-puesto-header-text font-black uppercase tracking-widest text-lg rounded-xl hover:opacity-90 transition-all border-b-4 border-black/30 hover:-translate-y-1 hover:shadow-xl">
                Crear Usuario
            </button>
        </form>
    </div>
</div>
</body>
</html>
