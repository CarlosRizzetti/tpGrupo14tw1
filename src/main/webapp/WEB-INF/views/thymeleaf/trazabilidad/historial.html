<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layouts/app :: layout(~{::content}, ~{::header_left}, ~{::header_center}, ~{::header_right}, _, _)}">
<head>
    <title>Historial de Trazabilidad</title>
</head>
<body>

<div th:fragment="header_left">
    <a th:href="@{/admin}" class="flex items-center px-4 py-2 bg-black/10 hover:bg-black/20 rounded-lg font-bold uppercase text-xs border border-white/20 transition">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 mr-1" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M15 19l-7-7 7-7" />
        </svg>
        Volver
    </a>
</div>

<div th:fragment="header_center">
    <span class="text-puesto-header-text font-bold uppercase tracking-widest">Trazabilidad de Producción</span>
</div>

<div th:fragment="header_right"></div>

<div th:fragment="content" class="p-6 max-w-7xl mx-auto">
    <div class="mb-8">
        <h2 class="text-3xl font-black text-black opacity-80 mb-2">Historial de Productos Generados</h2>
        <p class="font-black mb-2 opacity-80">Aquí puedes ver los artículos utilizados para generar cada lote.</p>
    </div>

    <div class="bg-white rounded-3xl shadow-xl overflow-hidden">
        <table class="w-full text-left border-collapse">
            <thead>
                <tr class="bg-gray-100 text-gray-700">
                    <th class="p-4 font-bold border-b">Fecha de Generación</th>
                    <th class="p-4 font-bold border-b">Producto Final</th>
                    <th class="p-4 font-bold border-b">Lote / Vencimiento</th>
                    <th class="p-4 font-bold border-b">Artículos Utilizados (Composición)</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="t : ${historial}" class="border-b hover:bg-gray-50 transition-colors">
                    <td class="p-4 align-top" th:text="${#temporals.format(t.fechaGeneracion, 'dd/MM/yyyy HH:mm:ss')}"></td>
                    <td class="p-4 font-bold align-top" th:text="${t.producto.nombre}"></td>
                    <td class="p-4 align-top">
                        <span class="font-bold text-gray-800" th:text="${t.timer.groupId}">Lote</span><br/>
                        <span class="text-sm text-gray-500" th:text="'Vence: ' + ${#temporals.format(t.timer.cicloVida.fechaVencimiento, 'dd/MM/yyyy HH:mm')}">Vencimiento</span>
                    </td>
                    <td class="p-4 align-top">
                        <ul class="list-disc pl-4 text-sm text-gray-700">
                            <li th:each="d : ${t.articulosUsados}" class="mb-1">
                                <span th:text="${d.cantidadUsada} + ' x ' + ${d.articulo.nombre}"></span>
                                <span class="text-xs font-bold text-gray-600 bg-gray-200 px-2 py-0.5 rounded ml-1" 
                                      th:text="'Lote: ' + (${d.articulo.numeroDeLote != null ? d.articulo.numeroDeLote : 'S/N'})">
                                </span>
                            </li>
                        </ul>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(historial)}">
                    <td colspan="4" class="p-6 text-center text-gray-500">No hay registros de trazabilidad todavía.</td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

</body>
</html>
