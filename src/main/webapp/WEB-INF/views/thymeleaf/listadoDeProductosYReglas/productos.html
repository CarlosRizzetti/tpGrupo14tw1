
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layouts/app :: layout(~{::content}, ~{::header_left}, ~{::header_center}, ~{::header_right}, ~{}, _)}">
<head>
    <title>Productos</title>
</head>
<body>

<div th:fragment="header_center">
    <span class="text-puesto-header-text font-bold uppercase tracking-widest"
          th:text="${categoria != null ? 'Productos de ' + categoria.nombre : 'Seleccione Producto'}">
        Seleccione Producto
    </span>
</div>

<div th:fragment="header_left">
    <a th:href="@{/home}" class="flex items-center px-4 py-2 bg-black/10 hover:bg-black/20 rounded-lg font-bold uppercase text-xs border border-white/20 transition">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 mr-1" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M15 19l-7-7 7-7" />
        </svg>
    Volver
    </a>
</div>

<div th:fragment="header_right">
    <a th:href="@{/dashboard}"
       class="hidden md:flex items-center px-4 py-2 bg-black/10 hover:bg-black/20 rounded-lg border border-white/20 transition text-xs font-bold uppercase tracking-wider">
        Dashboard
    </a>
</div>

<div th:fragment="content" class="p-6">

    <div class="mb-6 md:hidden">
        <a th:href="@{/}" class="inline-flex items-center px-4 py-2 bg-puesto-btn text-puesto-btn-text text-sm font-bold uppercase rounded-lg border border-puesto-btn-border shadow">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 mr-1" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M15 19l-7-7 7-7" />
            </svg>
            Volver
        </a>
    </div>



    <!-- Usuarios Section -->
    <div class="mb-8" th:if="${usuarios != null}">
        <h3 class="font-bold text-xl mb-4 text-gray-800 dark:text-gray-200">Usuarios en esta Categoría:</h3>
        
        <div th:if="${!#lists.isEmpty(usuarios)}" class="flex flex-wrap gap-2">
            <span th:each="usuario : ${usuarios}" 
                  class="px-4 py-2 bg-blue-100 text-blue-800 rounded-full font-semibold text-sm shadow-sm"
                  th:text="${usuario.email}">
            </span>
        </div>
        
        <div th:if="${#lists.isEmpty(usuarios)}" class="text-gray-500 italic text-sm">
            No hay usuarios asignados a esta categoría.
        </div>
    </div>

    <!-- Boton Articulos Almacen -->
    <div th:if="${categoria != null and categoria.id == 5}" class="mb-8 w-full flex flex-wrap gap-6 justify-center md:justify-start">
        <a th:href="@{/almacen/articulos}" class="group relative flex flex-col items-center justify-center p-6 bg-puesto-btn text-puesto-btn-text text-3xl border-b-[8px] border-puesto-btn-border rounded-3xl shadow-xl hover:shadow-2xl transition-all duration-200 hover:-translate-y-2 min-h-[180px]">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10 mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10" />
            </svg>
            Ver todos los artículos
        </a>
        <a th:href="@{/almacen/stock}" class="group relative flex flex-col items-center justify-center p-6 bg-puesto-btn text-puesto-btn-text text-3xl border-b-[8px] border-puesto-btn-border rounded-3xl shadow-xl hover:shadow-2xl transition-all duration-200 hover:-translate-y-2 min-h-[180px]">
            <svg class="w-10 h-10 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 17v-2m3 2v-4m3 4v-6m2 10H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
            Consultar Stock
        </a>
        <a th:href="@{/almacen/nuevo-articulo}" class="group relative flex flex-col items-center justify-center p-6 bg-puesto-btn text-puesto-btn-text text-3xl border-b-[8px] border-puesto-btn-border rounded-3xl shadow-xl hover:shadow-2xl transition-all duration-200 hover:-translate-y-2 min-h-[180px]">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10 mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
            </svg>
            Ingresar Producto
        </a>
    </div>


    <!-- Boton Ingresar Producto Trazabilidad -->
    <div th:if="${categoria != null and categoria.id == 6}" class="mb-8 w-full flex justify-center md:justify-start">
        <a th:href="@{/trazabilidad/nuevo-articulo}" class="group relative flex flex-col items-center justify-center p-6 bg-puesto-btn text-puesto-btn-text text-3xl border-b-[8px] border-puesto-btn-border rounded-3xl shadow-xl hover:shadow-2xl transition-all duration-200 hover:-translate-y-2 min-h-[180px]">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10 mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
            </svg>
            Ingresar Producto
        </a>
    </div>

</div>
</body>
