<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layouts/app :: layout(~{::content}, ~{::header_left}, ~{::header_center}, _, _, ~{::scripts})}">
<head>
    <title>Historial de Pedidos</title>
</head>
<body>

<!-- HEADER LEFT -->
<div th:fragment="header_left">
    <a th:href="@{/admin}"
       class="hidden md:flex items-center px-4 py-2 bg-black/10 hover:bg-black/20 rounded-lg border border-white/20 transition text-xs font-bold uppercase tracking-wider">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 mr-1" fill="none" viewBox="0 0 24 24"
             stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M15 19l-7-7 7-7"/>
        </svg>
        Volver
    </a>
</div>

<!-- HEADER CENTER -->
<div th:fragment="header_center">
    <h1 class="text-puesto-header-text font-bold uppercase tracking-widest">
        Historial de Pedidos
    </h1>
</div>

<!-- CONTENT -->
<div th:fragment="content" class="max-w-4xl mx-auto p-6 md:p-8">

    <!-- ==================== Filtros ==================== -->
    <form id="filtros-historial" class="bg-white rounded-lg shadow p-6 mb-6 grid grid-cols-2 md:grid-cols-5 gap-4 items-end">
        <div class="col-span-1">
            <label for="desde" class="block text-xs font-bold text-gray-500 uppercase mb-1">Desde</label>
            <input type="date" id="desde" name="desde" class="w-full border border-gray-300 rounded-md p-2 text-sm">
        </div>
        <div class="col-span-1">
            <label for="hasta" class="block text-xs font-bold text-gray-500 uppercase mb-1">Hasta</label>
            <input type="date" id="hasta" name="hasta" class="w-full border border-gray-300 rounded-md p-2 text-sm">
        </div>
        <div class="col-span-1">
            <label for="numeroDeLote" class="block text-xs font-bold text-gray-500 uppercase mb-1">N° de lote</label>
            <input type="number" id="numeroDeLote" name="numeroDeLote" placeholder="Ej: 12"
                   class="w-full border border-gray-300 rounded-md p-2 text-sm">
        </div>
        <div class="col-span-1">
            <label for="clienteNombre" class="block text-xs font-bold text-gray-500 uppercase mb-1">Cliente</label>
            <input type="text" id="clienteNombre" name="clienteNombre" placeholder="Nombre del cliente"
                   class="w-full border border-gray-300 rounded-md p-2 text-sm">
        </div>
        <div class="col-span-2 md:col-span-1 flex gap-2">
            <button type="submit"
                    class="w-full bg-puesto-btn text-white font-bold text-sm rounded-md py-2 hover:opacity-90 transition">
                Buscar
            </button>
            <button type="reset"
                    class="w-full bg-gray-100 text-gray-700 font-bold text-sm rounded-md py-2 hover:bg-gray-200 transition">
                Limpiar
            </button>
        </div>
    </form>

    <!-- ==================== Resultados (renderizados por JS) ==================== -->
    <div id="resultados-pedidos" class="space-y-4">
        <p class="text-gray-400 text-sm">Cargando...</p>
    </div>

</div>

<!-- SCRIPTS -->
<th:block th:fragment="scripts">
    <script type="module" th:src="@{/resources/core/js/historialPedidos.js}"></script>
</th:block>

</body>
</html>
