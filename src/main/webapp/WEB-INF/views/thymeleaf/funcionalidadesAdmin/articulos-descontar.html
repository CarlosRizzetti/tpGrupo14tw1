<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layouts/app :: layout(~{::content}, ~{::header_left}, ~{::header_center}, ~{::header_right}, ~{}, ~{::scripts})}">
<head>
    <title>Descartar Stock</title>
</head>
<body>
<div th:fragment="header_center">
    <span class="text-puesto-header-text font-bold uppercase tracking-widest">
        Descartar Stock
    </span>
</div>
<div th:fragment="header_left">
    <a th:href="@{/admin}" class="flex items-center px-4 py-2 bg-black/10 hover:bg-black/20 rounded-lg font-bold uppercase text-xs border border-white/20 transition">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 mr-1" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M15 19l-7-7 7-7" />
        </svg>
        Volver
    </a>
</div>
<div th:fragment="header_right">
    <a th:href="@{/dashboard}"
       class="hidden md:flex items-center px-4 py-2 bg-black/10 hover:bg-black/20 rounded-lg border border-white/20 transition text-xs font-bold uppercase tracking-wider">
        Dashboard
    </a>
</div>
<div th:fragment="content" class="p-6 max-w-6xl mx-auto">

    <div class="mb-6 md:hidden">
        <a th:href="@{/admin}" class="inline-flex items-center px-4 py-2 bg-puesto-btn text-puesto-btn-text text-sm font-bold uppercase rounded-lg border border-puesto-btn-border shadow">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 mr-1" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M15 19l-7-7 7-7" />
            </svg>
            Volver
        </a>
    </div>
    <div class="bg-white dark:bg-gray-800 rounded-xl shadow-lg overflow-hidden border border-gray-200 dark:border-gray-700">
        <div class="px-6 py-4 border-b border-gray-200 dark:border-gray-700 bg-gray-50 dark:bg-gray-900/50 flex justify-between items-center">
            <h2 class="text-xl font-bold text-gray-800 dark:text-white flex items-center">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 mr-2 text-red-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                </svg>
                Lotes Activos para Descartar
            </h2>
            <div class="flex items-center space-x-3">
                <span class="bg-red-100 text-red-800 text-xs font-semibold px-2.5 py-1 rounded-lg dark:bg-red-200 dark:text-red-900" th:text="${#lists.size(articulos)} + ' Lotes'"></span>
            </div>
        </div>

        <div th:if="${#lists.isEmpty(articulos)}" class="text-center p-10 bg-white dark:bg-gray-800">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-12 w-12 mx-auto text-gray-400 mb-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M20 13V6a2 2 0 00-2-2H6a2 2 0 00-2 2v7m16 0v5a2 2 0 01-2 2H6a2 2 0 01-2-2v-5m16 0h-2.586a1 1 0 00-.707.293l-2.414 2.414a1 1 0 01-.707.293h-3.172a1 1 0 01-.707-.293l-2.414-2.414A1 1 0 006.586 13H4" />
            </svg>
            <p class="text-lg text-gray-500 dark:text-gray-400 font-medium">No hay lotes activos para descartar.</p>
        </div>
        <div th:unless="${#lists.isEmpty(articulos)}" class="p-4 border-b border-gray-200 dark:border-gray-700 bg-gray-50 dark:bg-gray-800 flex flex-wrap gap-4 items-end">
            <div class="flex-1 min-w-[200px]">
                <label for="filterDescripcion" class="block text-sm font-medium text-gray-700 dark:text-gray-300">Filtrar por Producto</label>
                <input type="text" id="filterDescripcion" class="mt-1 block w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-md shadow-sm focus:ring-red-500 focus:border-red-500 dark:bg-gray-700 dark:text-white sm:text-sm" placeholder="Ingrese nombre de producto...">
            </div>
            <div class="bg-red-100 dark:bg-red-900 px-4 py-2 rounded-lg shadow-sm border border-red-200 dark:border-red-800 flex items-center justify-center">
                <span class="text-sm font-semibold text-red-800 dark:text-red-200 mr-2">Cantidad Total Filtrada:</span>
                <span id="cantidadTotal" class="text-lg font-bold text-red-900 dark:text-red-100">0</span>
            </div>
        </div>
        <div th:unless="${#lists.isEmpty(articulos)}" class="overflow-x-auto">
            <table class="w-full text-sm text-left text-gray-500 dark:text-gray-400">
                <thead class="text-xs text-gray-700 uppercase bg-gray-50 dark:bg-gray-700 dark:text-gray-300">
                <tr>
                    <th scope="col" class="px-6 py-3 rounded-tl-lg">Nombre</th>
                    <th scope="col" class="px-6 py-3">Nº Lote</th>
                    <th scope="col" class="px-6 py-3 text-center">Vencimiento</th>
                    <th scope="col" class="px-6 py-3 text-center">Cantidad</th>
                    <th scope="col" class="px-6 py-3 text-center">Estado</th>
                    <th scope="col" class="px-6 py-3 text-center rounded-tr-lg">Acción</th>
                </tr>
                </thead>
                <tbody id="articulosTableBody">
                <tr th:each="articulo : ${articulos}" class="articulo-row bg-white border-b dark:bg-gray-800 dark:border-gray-700 hover:bg-gray-50 dark:hover:bg-gray-700/50 transition">
                    <td class="px-6 py-4 font-medium text-gray-900 dark:text-white articulo-nombre" th:text="${articulo.producto.nombre}"></td>
                    <td class="px-6 py-4">
                        <span class="bg-gray-100 text-gray-800 text-xs font-medium px-2.5 py-0.5 rounded dark:bg-gray-700 dark:text-gray-300 border border-gray-200 dark:border-gray-600" th:text="${articulo.numeroDeLote}"></span>
                    </td>
                    <td class="px-6 py-4 text-center text-red-600 dark:text-red-400 font-semibold" th:text="${#temporals.format(articulo.fechaDeVencimiento, 'dd/MM/yyyy')}"></td>
                    <td class="px-6 py-4 text-center font-semibold text-indigo-600 dark:text-indigo-400 articulo-cantidad"
                        th:text="${articulo.cantidadDisponible != null ? articulo.cantidadDisponible + ' ' + (articulo.producto.unidadDeMedida != null ? articulo.producto.unidadDeMedida.name() : '') : '-'}"
                        th:data-cantidad="${articulo.cantidadDisponible != null ? articulo.cantidadDisponible : 0}"></td>
                    <td class="px-6 py-4 text-center">
                        <span th:if="${articulo.estado.name() == 'DISPONIBLE'}" class="bg-gray-100 text-gray-800 text-xs font-semibold px-2.5 py-0.5 rounded dark:bg-gray-700 dark:text-gray-300">Disponible</span>
                        <span th:if="${articulo.estado.name() == 'EN_USO'}" class="bg-blue-100 text-blue-800 text-xs font-semibold px-2.5 py-0.5 rounded dark:bg-blue-900/40 dark:text-blue-300">En uso</span>
                    </td>
                    <td class="px-6 py-4 text-center">
                        <form th:action="@{/admin/articulos/descartar}" method="post" onsubmit="return confirm('¿Está seguro de descartar este lote? Esta acción no se puede deshacer.');">
                            <input type="hidden" name="idLote" th:value="${articulo.id}">
                            <button type="submit" class="inline-flex items-center px-3 py-1.5 bg-red-600 hover:bg-red-700 text-white text-xs font-bold rounded-md transition shadow hover:shadow-md">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 mr-1" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                                </svg>
                                Descartar
                            </button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script th:fragment="scripts">
    document.addEventListener('DOMContentLoaded', function() {
        const filterDescripcion = document.getElementById('filterDescripcion');
        const cantidadTotalSpan = document.getElementById('cantidadTotal');
        const rows = document.querySelectorAll('.articulo-row');
        function filterTable() {
            if (!filterDescripcion) return;
            const textDesc = filterDescripcion.value.toLowerCase().trim();
            let sum = 0;
            rows.forEach(row => {
                const nombreCell = row.querySelector('.articulo-nombre');
                const nombre = nombreCell ? nombreCell.textContent.toLowerCase() : '';
                const matchesDesc = nombre.includes(textDesc);
                if (matchesDesc) {
                    row.style.display = '';
                    const cantCell = row.querySelector('.articulo-cantidad');
                    if (cantCell && cantCell.dataset.cantidad) {
                        sum += parseFloat(cantCell.dataset.cantidad) || 0;
                    }
                } else {
                    row.style.display = 'none';
                }
            });
            cantidadTotalSpan.textContent = Number.isInteger(sum) ? sum : sum.toFixed(2);
        }
        if (filterDescripcion) filterDescripcion.addEventListener('input', filterTable);
        // Initial sum
        filterTable();
    });
</script>
</body>
</html>
