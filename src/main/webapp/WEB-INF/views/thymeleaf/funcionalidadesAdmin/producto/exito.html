<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layouts/app :: layout(~{::content}, _, ~{::header_center}, ~{::header_right}, _, _)}">
<head>
  <title>Éxito</title>
</head>
<body>

<div th:fragment="header_center">
  <h1 class="text-white text-3xl font-black uppercase text-center mt-20 drop-shadow-md tracking-wider flex justify-center items-center">OPERACIÓN EXITOSA</h1>
</div>

<div th:fragment="header_right">
</div>

<div th:fragment="content" class="w-full flex justify-center mt-8">
  <div class="w-full max-w-lg bg-white rounded-lg shadow-md p-8 text-center">
    <div class="mx-auto flex items-center justify-center h-12 w-12 rounded-full bg-green-100 mb-4">
      <svg class="h-6 w-6 text-green-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
      </svg>
    </div>
    <h2 class="text-2xl font-bold text-gray-900 mb-2">¡Producto Creado!</h2>
    <p class="text-gray-600 mb-6">El producto se ha guardado correctamente y ya está disponible en las categorías seleccionadas.</p>
    
    <div class="space-y-3">
      <a th:href="@{/producto/nuevo}" class="w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-puesto-btn hover:bg-puesto-btn-hover focus:outline-none">
        Crear otro producto
      </a>
      <a th:href="@{/home}" class="w-full flex justify-center py-2 px-4 border border-gray-300 rounded-md shadow-sm text-sm font-medium text-gray-700 bg-white hover:bg-gray-50 focus:outline-none">
        Volver al inicio
      </a>
    </div>
  </div>
</div>

</body>
</html>
