<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layouts/app :: layout(~{::content}, ~{::header_left}, ~{::header_center}, ~{::header_right}, _, _)}">
<head>
  <title>Gestión de Productos</title>
</head>
<body>

<div th:fragment="header_left">
  <a th:href="@{/admin}" class="flex items-center px-4 py-2 bg-black/10 hover:bg-black/20 rounded-lg font-bold uppercase text-xs border border-white/20 transition">
    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 mr-1" fill="none" viewBox="0 0 24 24" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M15 19l-7-7 7-7" />
    </svg>
    Volver
  </a>
</div>

<div th:fragment="header_center">
  <span class="text-puesto-header-text font-bold uppercase tracking-widest">Gestión de Productos</span>
</div>

<div th:fragment="header_right">
  <a th:href="@{/admin/producto/nuevo}"
     class="flex items-center px-4 py-2 bg-black/10 hover:bg-black/20 rounded-lg border border-white/20 transition text-xs font-bold uppercase tracking-wider">
    + Nuevo Producto
  </a>
</div>

<div th:fragment="content" class="p-6">

  <!-- Filtro por categoría -->
  <form th:action="@{/admin/productos}" method="GET" class="mb-6 flex flex-wrap gap-3 items-center">
    <span class="text-sm font-bold text-gray-700 uppercase tracking-wider">Filtrar:</span>
    <a th:href="@{/admin/productos}"
       th:classappend="${categoriaSeleccionada == null} ? ' bg-gray-800 text-white' : ' bg-white text-gray-700 hover:bg-gray-100'"
       class="px-4 py-2 rounded-xl text-xs font-bold border border-gray-200 transition">
      Todos
    </a>
    <a th:each="cat : ${categorias}"
       th:href="@{/admin/productos(categoriaId=${cat.id})}"
       th:text="${cat.nombre}"
       th:classappend="${categoriaSeleccionada == cat.id} ? ' bg-gray-800 text-white' : ' bg-white text-gray-700 hover:bg-gray-100'"
       class="px-4 py-2 rounded-xl text-xs font-bold border border-gray-200 transition">
    </a>
  </form>

  <!-- Sin resultados -->
  <div th:if="${#lists.isEmpty(productos)}" class="text-center p-10 mt-10 bg-white/5 rounded-xl border border-white/10">
    <p class="text-xl text-white font-bold opacity-70">No hay productos registrados.</p>
  </div>

  <!-- Tabla de productos -->
  <div th:unless="${#lists.isEmpty(productos)}" class="overflow-x-auto rounded-2xl border border-black/10 shadow">
    <table class="w-full text-sm text-left border-collapse">
      <thead class="uppercase text-xs tracking-wider bg-puesto-header text-puesto-header-text">
        <tr>
          <th class="px-6 py-3">Producto</th>
          <th class="px-6 py-3">Categorías</th>
          <th class="px-6 py-3 text-center">Stock actual</th>
          <th class="px-6 py-3 text-center">Gestionar stock</th>
        </tr>
      </thead>
      <tbody>
        <tr th:each="p : ${productos}"
            class="border-b border-black/10 bg-white hover:bg-yellow-50 transition text-gray-800">

          <td class="px-6 py-4 font-bold" th:text="${p.nombre}"></td>

          <td class="px-6 py-4">
            <div class="flex flex-wrap gap-1">
              <span th:each="cat : ${p.categorias}"
                    th:text="${cat.nombre}"
                    class="px-2 py-0.5 rounded text-xs font-bold bg-gray-200 text-gray-700">
              </span>
            </div>
          </td>

          <td class="px-6 py-4 text-center">
  <span th:text="${stockPorProducto.get(p.id)}"
        th:classappend="${stockPorProducto.get(p.id) == 0} ? ' text-red-600' : ' text-green-700'"
        class="text-lg font-black">
  </span>
          </td>

          <td class="px-6 py-4 text-center">
            <a th:href="@{/admin/nuevo-articulo(productoId=${p.id})}"
               class="inline-flex items-center px-3 py-2 bg-green-600 text-white border-b-4 border-green-800 rounded-xl text-xs font-black uppercase tracking-wider active:border-b-0 active:translate-y-1 transition-all hover:opacity-90">
              + Agregar lote
            </a>
          </td>

        </tr>
      </tbody>
    </table>
  </div>


</div>

</body>
</html>
