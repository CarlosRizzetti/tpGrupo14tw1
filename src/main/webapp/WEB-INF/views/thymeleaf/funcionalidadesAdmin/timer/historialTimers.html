<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layouts/app :: layout(~{::content}, ~{::header_left}, ~{::header_center}, ~{::header_right}, _, ~{::scripts})}">

<div th:fragment="header_left" th:remove="tag">
    <a th:href="@{/admin}"
       class="hidden md:flex items-center px-4 py-2 bg-black/10 hover:bg-black/20 rounded-lg border border-white/20 transition text-xs font-bold uppercase tracking-wider">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 mr-1" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M15 19l-7-7 7-7" />
        </svg>
        Volver
    </a>
</div>

<div th:fragment="header_center" th:remove="tag">
    <h1 class="text-puesto-header-text font-bold uppercase tracking-widest">
        Historial de Timers
    </h1>
</div>

<div th:fragment="header_right" th:remove="tag">
    <div></div>
</div>

<div th:fragment="content" class="p-4 md:p-6 max-w-5xl mx-auto space-y-6">

    <div class="bg-white rounded-2xl shadow-sm border border-gray-200 p-4 sm:p-6 flex flex-col md:flex-row justify-between items-center gap-4 sticky top-0 z-10">
        <div class="hidden md:block">
            <p class="text-sm text-gray-500 font-bold uppercase tracking-wider">Filtrar registros</p>
        </div>

        <div class="flex flex-col sm:flex-row gap-3 w-full md:w-auto">
            <select id="filtro-estado" class="bg-gray-50 border border-gray-300 text-gray-800 text-xs sm:text-sm rounded-xl focus:ring-puesto-btn focus:border-puesto-btn block w-full p-2.5 font-bold uppercase cursor-pointer outline-none transition-colors">
                <option value="">TODOS LOS ESTADOS</option>
                <option value="ACTIVO">ACTIVO</option>
                <option value="VENCIDO">VENCIDO</option>
                <option value="ELIMINADO">ELIMINADO</option>
                <option value="IMPORTADO">IMPORTADO</option>
                <option value="RENOVADO">RENOVADO</option>
            </select>

            <select id="filtro-categoria" class="bg-gray-50 border border-gray-300 text-gray-800 text-xs sm:text-sm rounded-xl focus:ring-puesto-btn focus:border-puesto-btn block w-full p-2.5 font-bold uppercase cursor-pointer outline-none transition-colors">
                <option value="">TODAS LAS CATEGORÍAS</option>
                <option th:each="cat : ${categorias}"
                        th:value="${cat.id}"
                        th:text="${cat.nombre}"></option>
            </select>
        </div>
    </div>

    <div id="timers-container" class="space-y-4 pb-20">

        <div th:each="timer : ${timers}"
             th:classappend="${timer.getCategoria().getTema()}"
             th:attr="data-timer-id=${timer.id}"
             class="timer-card cursor-pointer hover:shadow-md bg-white rounded-2xl shadow-sm border border-gray-100 flex flex-col md:flex-row overflow-hidden transform transition-all">

            <div class="bg-puesto-header p-5 md:w-1/3 flex flex-col justify-center border-b-[6px] md:border-b-0 md:border-l-[6px] border-puesto-btn">
                <span class="text-[10px] font-black text-white/80 uppercase tracking-widest mb-1"
                      th:text="${timer.ubicacion ?: 'General'}">Ubicación</span>
                <h2 class="text-xl font-black text-puesto-header-text uppercase leading-tight line-clamp-2 break-words"
                    th:text="${timer.nombre}">Nombre Producto</h2>
            </div>

            <div class="p-5 md:w-1/3 flex flex-col justify-center gap-3 border-b md:border-b-0 md:border-r border-gray-100 bg-white">
                <div>
                    <span class="text-[9px] font-bold text-gray-400 uppercase tracking-widest block mb-0.5">Estado</span>
                    <span class="text-sm font-black text-gray-800 uppercase"
                          th:text="${timer.estado}">--</span>
                </div>
                <div>
                    <span class="text-[9px] font-bold text-gray-400 uppercase tracking-widest block mb-0.5">Elaboración</span>
                    <span class="text-sm font-black text-gray-800 js-formatear-fecha"
                          th:text="${timer.cicloVida.fechaCreacion}">--</span>
                </div>
                <div>
                    <span class="text-[9px] font-bold text-gray-400 uppercase tracking-widest block mb-0.5">Vencimiento</span>
                    <span class="text-sm font-black text-puesto-header js-formatear-fecha"
                          th:text="${timer.cicloVida.fechaVencimiento}">--</span>
                </div>
                <div>
                    <span class="text-[9px] font-bold text-gray-400 uppercase tracking-widest block mb-0.5">Lotes utilizados</span>
                    <div class="flex flex-wrap gap-1">
                        <a th:each="lote : ${timer.lotesUtilizados}"
                           th:href="@{'/admin/lotes/' + ${lote.id}}"
                           class="lote-link text-[10px] font-bold text-blue-600 hover:underline bg-blue-50 px-2 py-0.5 rounded"
                           th:text="'Lote #' + ${lote.numeroDeLote} + ' (x' + ${lote.cantidadConsumida} + ')'">
                            Lote #1 (x5)
                        </a>
                        <span th:if="${#lists.isEmpty(timer.lotesUtilizados)}" class="text-[10px] text-gray-400">Sin lotes</span>
                    </div>
                </div>
            </div>

            <div class="p-5 md:w-1/3 flex flex-row md:flex-col justify-between items-center md:items-end bg-white">
                <div class="text-left md:text-right">
                    <span class="text-[9px] font-bold text-gray-400 uppercase tracking-widest block mb-0.5">Cantidad</span>
                    <span class="text-3xl font-black text-gray-800 tabular-nums" th:text="${timer.cantidad}">0</span>
                </div>

                <div class="flex items-center gap-1.5 bg-gray-50 border border-gray-100 px-3 py-1.5 rounded-lg">
                    <svg class="w-4 h-4 text-gray-400" fill="currentColor" viewBox="0 0 24 24">
                        <path fill-rule="evenodd" d="M12 12a5 5 0 100-10 5 5 0 000 10zm-7 8a7 7 0 1114 0H5z" clip-rule="evenodd"/>
                    </svg>
                    <span class="text-[10px] font-bold text-gray-500 uppercase tracking-wider max-w-[100px] truncate"
                          th:text="${timer.usuario != null ? timer.usuario : 'Sistema'}">Usuario</span>
                </div>
            </div>
        </div>

        <div th:if="${#lists.isEmpty(timers)}" class="text-center py-16 bg-white rounded-2xl border border-dashed border-gray-300">
            <p class="text-gray-400 font-bold uppercase tracking-widest">No hay registros para mostrar</p>
        </div>

    </div>
</div></div>

<th:block th:fragment="scripts">
    <script type="module" th:src="@{/resources/core/js/historialTimers.js}"></script>
</th:block>
</html>
