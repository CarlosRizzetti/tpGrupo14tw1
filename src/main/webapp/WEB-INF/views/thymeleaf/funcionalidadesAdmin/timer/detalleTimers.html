<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layouts/app :: layout(~{::content}, ~{::header_left}, ~{::header_center}, _, _, _)}">
<head>
    <title>Detalle de Timer</title>
</head>
<body>

<!-- HEADER LEFT -->
<div th:fragment="header_left">
    <a th:href="@{/admin}"
       class="hidden md:flex items-center px-4 py-2 bg-black/10 hover:bg-black/20 rounded-lg border border-white/20 transition text-xs font-bold uppercase tracking-wider">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 mr-1" fill="none" viewBox="0 0 24 24"
             stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M15 19l-7-7 7-7"/>
        </svg>
        Volver
    </a>
</div>

<!-- HEADER CENTER -->
<div th:fragment="header_center">
    <h1 class="text-puesto-header-text font-bold uppercase tracking-widest">
        Detalle de Timer
    </h1>
</div>

<!-- CONTENT -->
<div th:fragment="content" class="max-w-4xl mx-auto p-6 md:p-8">

    <!-- ==================== Datos del timer ==================== -->
    <div class="bg-white rounded-lg shadow p-6">
        <div class="flex items-center justify-between mb-4">
            <h2 class="text-2xl font-bold text-gray-800" th:text="${timer.nombre}">Timer</h2>
            <span class="px-3 py-1 rounded-full text-sm font-semibold bg-blue-100 text-blue-800"
                  th:text="${timer.estado}">
        ESTADO
      </span>
        </div>

        <div class="grid grid-cols-2 md:grid-cols-3 gap-4 text-sm">
            <div>
                <p class="text-gray-500">Ubicación</p>
                <p class="font-semibold" th:text="${timer.ubicacion}">-</p>
            </div>
            <div>
                <p class="text-gray-500">Categoría</p>
                <p class="font-semibold" th:text="${timer.categoria != null} ? ${timer.categoria.nombre} : '-'">-</p>
            </div>
            <div>
                <p class="text-gray-500">Usuario</p>
                <p class="font-semibold" th:text="${timer.usuario}">-</p>
            </div>
            <div>
                <p class="text-gray-500">Fecha de creación</p>
                <p class="font-semibold" id="fecha-creacion" th:text="${timer.cicloVida.fechaCreacion}">-</p>
            </div>
            <div>
                <p class="text-gray-500">Fecha de vencimiento</p>
                <p class="font-semibold" id="fecha-vencimiento" th:text="${timer.cicloVida.fechaVencimiento}">-</p>
            </div>
            <div>
                <p class="text-gray-500">Cantidad</p>
                <p class="font-semibold" th:text="${timer.cantidad}">-</p>
            </div>
        </div>
    </div>

    <!-- ==================== Lotes utilizados ==================== -->
    <div class="bg-white rounded-lg shadow p-6 mt-6">
        <h2 class="text-lg font-bold text-gray-800 mb-4">Lotes utilizados para este timer</h2>

        <table class="w-full text-sm text-left" th:if="${not #lists.isEmpty(timer.lotesUtilizados)}">
            <thead>
            <tr class="border-b text-gray-500">
                <th class="py-2">N° de lote</th>
                <th class="py-2">Cantidad consumida</th>
                <th class="py-2"></th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="lote : ${timer.lotesUtilizados}" class="border-b hover:bg-gray-50">
                <td class="py-2 font-semibold" th:text="${lote.numeroDeLote}">1</td>
                <td class="py-2" th:text="${lote.cantidadConsumida}">-</td>
                <td class="py-2 text-right">
                    <a th:href="@{'/admin/lotes/' + ${lote.id}}" class="text-blue-600 hover:underline text-xs">
                        Ver lote
                    </a>
                </td>
            </tr>
            </tbody>
        </table>

        <p th:if="${#lists.isEmpty(timer.lotesUtilizados)}" class="text-gray-500 text-sm">
            Este timer no consumió stock de ningún lote.
        </p>
    </div>

    <script>
        const formatearFecha = (fechaIso) => {
            if (!fechaIso) return '-';
            const fecha = new Date(fechaIso);
            return fecha.toLocaleString('es-AR', { dateStyle: 'short', timeStyle: 'short' });
        };

        const elementoFechaCreacion = document.getElementById('fecha-creacion');
        const elementoFechaVencimiento = document.getElementById('fecha-vencimiento');

        if (elementoFechaCreacion) {
            elementoFechaCreacion.textContent = formatearFecha(elementoFechaCreacion.textContent.trim());
        }
        if (elementoFechaVencimiento) {
            elementoFechaVencimiento.textContent = formatearFecha(elementoFechaVencimiento.textContent.trim());
        }
    </script>

</div>

</body>
</html>
