<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layouts/app :: layout(~{::content}, _, ~{::header_center}, _, _,_)}">
<head>
    <title>Validación de identidad / MCD Vencimientos</title>
</head>
<body>

<div th:fragment="header_center">
    <span class="text-puesto-header-text font-bold uppercase tracking-widest">Validación de identidad</span>
</div>

<div th:fragment="content" class="p-6 flex flex-col items-center justify-center min-h-[calc(100vh-7rem)]">
    <div class="w-full max-w-md bg-puesto-btn text-puesto-btn-text p-8 rounded-3xl border-b-[8px] border-puesto-btn-border shadow-2xl relative">
        <div class="text-center mb-8">
            <h2 class="text-3xl font-black uppercase tracking-tighter mb-2">Validación</h2>
            <p class="text-sm opacity-80 font-medium">Revisá tu correo para completar el registro</p>
        </div>

        <div th:if="${message != null and success}" class="mb-6 p-4 bg-green-100/90 border-l-4 border-green-500 text-green-800 rounded shadow-inner">
            <span class="font-bold text-sm" th:text="${message}"></span>
        </div>
        <p th:if="${success}" class="mb-4 text-xs font-bold opacity-80">
            Serás redirigido al inicio de sesión en
            <span th:text="${redirectDelayMs / 1000}"></span> segundos.
        </p>
        <div th:if="${message != null and !success}" class="mb-6 p-4 bg-red-100/90 border-l-4 border-red-500 text-red-800 rounded shadow-inner">
            <span class="font-bold text-sm" th:text="${message}"></span>
        </div>

        <div th:if="${success == null or !success}">
            <p class="text-sm opacity-80 font-medium mb-4">
                Si recibiste un código, podés ingresarlo manualmente:
            </p>

            <form id="form-validacion" th:action="@{/validacion-identidad}" method="POST" class="space-y-5">
                <div>
                    <label for="token" class="block text-sm font-bold uppercase tracking-wider mb-2">Código de validación</label>
                    <input id="token" name="token" type="text"
                           class="w-full px-5 py-4 rounded-xl text-black bg-white focus:ring-4 focus:ring-puesto-app outline-none transition-shadow"
                           placeholder="Pegar código o token" required />
                </div>

                <button id="btn-validar" type="submit"
                        class="w-full py-4 mt-2 font-black uppercase tracking-widest text-lg rounded-xl transition-all border-b-4 border-black/20 hover:-translate-y-1 hover:shadow-xl
                               bg-puesto-header text-puesto-header-text hover:opacity-90">
                    Validar
                </button>
            </form>
        </div>

        <div class="mt-8 text-center border-t border-white/20 pt-6">
            <a id="btn-volver-login" th:href="@{/login}"
               class="text-sm font-bold opacity-80 hover:opacity-100 hover:underline uppercase tracking-wider transition-opacity">
                Volver al inicio de sesión
            </a>
        </div>
    </div>

    <script th:if="${success}" th:inline="javascript">
        /*<![CDATA[*/
        const redirectUrl = [[${redirectUrl}]];
        const delayMs = [[${redirectDelayMs}]];
        setTimeout(function() {
            window.location.href = redirectUrl;
        }, delayMs);
        /*]]>*/
    </script>
</div>
</body>

</html>
