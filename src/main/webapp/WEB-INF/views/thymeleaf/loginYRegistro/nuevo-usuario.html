<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layouts/app :: layout(~{::content}, _, ~{::header_center}, _, _,_)}">
<head>
    <title>Registro / MCD Vencimientos</title>
</head>
<body>

<div th:fragment="header_center">
    <span class="text-puesto-header-text font-bold uppercase tracking-widest">Crear Cuenta</span>
</div>

<div th:fragment="content" class="p-6 flex flex-col items-center justify-center min-h-[calc(100vh-7rem)]">
    <div class="w-full max-w-md bg-puesto-btn text-puesto-btn-text p-8 rounded-3xl border-b-[8px] border-puesto-btn-border shadow-2xl relative">
        <div class="text-center mb-8">
            <h2 class="text-3xl font-black uppercase tracking-tighter mb-2">Registro</h2>
            <p class="text-sm opacity-80 font-medium">Control de Etiquetas</p>
        </div>

        <div th:if="${error != null}" class="mb-6 p-4 bg-red-100/90 border-l-4 border-red-500 text-red-800 rounded shadow-inner">
            <span class="font-bold text-sm" th:text="${error}"></span>
        </div>

        <form id="form-registrarme" th:action="@{/registrarme}" method="POST" th:object="${usuario}" class="space-y-5">
            <div>
                <label for="nombre" class="block text-sm font-bold uppercase tracking-wider mb-2">Nombre</label>
                <input th:field="*{nombre}" id="nombre" type="text"
                       class="w-full px-5 py-4 rounded-xl text-black bg-white focus:ring-4 focus:ring-puesto-app outline-none transition-shadow"
                       placeholder="Juan García" required />
            </div>
            <div>
                <label for="email" class="block text-sm font-bold uppercase tracking-wider mb-2">Correo Electrónico</label>
                <input th:field="*{email}" id="email" type="email"
                       class="w-full px-5 py-4 rounded-xl text-black bg-white focus:ring-4 focus:ring-puesto-app outline-none transition-shadow"
                       placeholder="ejemplo@correo.com" required />
            </div>

            <div>
                <label for="password" class="block text-sm font-bold uppercase tracking-wider mb-2">Contraseña</label>
                <input th:field="*{password}" type="password" id="password"
                       class="w-full px-5 py-4 rounded-xl text-black bg-white focus:ring-4 focus:ring-puesto-app outline-none transition-shadow"
                       placeholder="********" required />
                <ul id="password-hint" class="mt-2 text-xs font-bold opacity-80 pl-4 list-disc">
                    <li id="hint-len" class="text-red-800">6-10 caracteres</li>
                    <li id="hint-upper" class="text-red-800">Al menos una mayúscula</li>
                    <li id="hint-num" class="text-red-800">Al menos un número</li>
                </ul>
            </div>

            <div>
                <label for="confirm-password" class="block text-sm font-bold uppercase tracking-wider mb-2">Repetir Contraseña</label>
                <input type="password" id="confirm-password" name="confirmPassword"
                       class="w-full px-5 py-4 rounded-xl text-black bg-white focus:ring-4 focus:ring-puesto-app outline-none transition-shadow"
                       placeholder="********" required />
                <ul class="mt-2 text-xs font-bold opacity-80 pl-4 list-disc">
                    <li id="hint-match" class="text-red-800">Las contraseñas deben coincidir</li>
                </ul>
                <p id="password-match-error" class="mt-2 text-xs font-bold text-red-800 hidden">
                    Las contraseñas no coinciden
                </p>
            </div>

            <button id="btn-registrarme" type="submit" disabled
                    class="w-full py-4 mt-6 font-black uppercase tracking-widest text-lg rounded-xl transition-all border-b-4 border-black/20 hover:-translate-y-1 hover:shadow-xl
                           bg-puesto-header text-puesto-header-text hover:opacity-90
                           disabled:bg-gray-400 disabled:text-gray-100 disabled:border-gray-500 disabled:cursor-not-allowed disabled:transform-none disabled:shadow-none disabled:opacity-100">
                Registrarme
            </button>
        </form>

        <div class="mt-8 text-center border-t border-white/20 pt-6">
            <a id="btn-volver" th:href="@{/login}"
               class="text-sm font-bold opacity-80 hover:opacity-100 hover:underline uppercase tracking-wider transition-opacity">
                Volver al inicio de sesión
            </a>
        </div>
    </div>

    <script th:src="@{/resources/core/js/nuevo-usuario.js}" defer></script>
</div>
</body>

</html>
